# LiteLLM 라우터 — 로컬 스택 전용 통합 엔드포인트
#
#   실행 (Mac Studio):
#     pip install 'litellm[proxy]'
#     litellm --config config/litellm.yaml --port 4000
#
#   사용:
#     curl http://127.0.0.1:4000/v1/chat/completions \
#       -H 'Content-Type: application/json' \
#       -d '{"model":"mai","messages":[{"role":"user","content":"안녕"}]}'
#
# ⚠️ Claude Code / Codex 는 여기에 태우지 마세요.
#    ANTHROPIC_BASE_URL 을 바꾸면 구독 인증이 깨지고 종량과금으로 전환됩니다.
#    이 라우터는 로컬 모델 전용입니다.

model_list:
  # ── T1: Mac Studio 로컬 (기본 [마이]) ─────────────────
  #     27B 인스턴스를 2~3개 띄우고 라운드로빈 (QWEN38-NEXT.md 6-6절)
  #     ⚠️ Ollama 금지 — M3 Ultra에서 14 tok/s. oMLX + MTP 경로를 쓸 것
  - model_name: mai
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://127.0.0.1:11434/v1
      api_key: "none"
    model_info:
      description: "상시 비서. 262K 컨텍스트, 네이티브 VLM. Mac Studio 로컬"
  - model_name: mai
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://127.0.0.1:11435/v1
      api_key: "none"

  # ── T0: MacBook 로컬 (이동 중 폴백) ───────────────────
  - model_name: mai-mobile
    litellm_params:
      model: openai/qwen3.8-27b-abliterated-mlx
      api_base: http://macbook.TAILNET.ts.net:11434/v1
      api_key: "none"

  # ── T1: Flash-Next — 에이전트 워크로드 A/B 전용 (온디맨드) ──
  #     상시 상주시키지 않는다. 27B와 실제 업무 프롬프트로 비교한 뒤 판단.
  - model_name: mai-next
    litellm_params:
      model: openai/qwen3.8-flash-next-reap-288
      api_base: http://127.0.0.1:11436/v1
      api_key: "none"
    model_info:
      description: "에이전트·툴 사용 A/B용. 미기동 시 mai 로 폴백"

  # ── T2: Station A — 배치 처리 (처리량 우선) ───────────
  #     27B AWQ를 GPU 1장당 1 replica 로 8개 띄우고 라운드로빈
  - model_name: mai-batch
    litellm_params:
      model: openai/qwen3.8-27b-awq
      api_base: http://station-a.TAILNET.ts.net:8001/v1
      api_key: "none"
    rpm: 600
  - model_name: mai-batch
    litellm_params:
      model: openai/qwen3.8-27b-awq
      api_base: http://station-a.TAILNET.ts.net:8002/v1
      api_key: "none"
    rpm: 600

  # ── 임베딩 (Station B) ────────────────────────────────
  - model_name: mai-embed
    litellm_params:
      model: openai/bge-m3
      api_base: http://station-b.TAILNET.ts.net:8100/v1
      api_key: "none"

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 600
  # 스테이션이 꺼져 있으면 즉시 로컬로 폴백 — 이게 자립성의 핵심
  fallbacks:
    - mai-next: ["mai", "mai-mobile"]
    - mai-batch: ["mai", "mai-mobile"]
    - mai: ["mai-mobile"]
  allowed_fails: 2
  cooldown_time: 60

litellm_settings:
  drop_params: true
  request_timeout: 600
  # 로컬 전용이므로 인증 없이 두되, 반드시 127.0.0.1 바인딩 + Tailscale 로만 노출
  set_verbose: false

general_settings:
  # tailnet 밖으로 절대 열지 말 것
  master_key: null
