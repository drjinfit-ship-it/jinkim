<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>몸의 법정</title>
<meta name="description" content="법원·공공기관 50분 실습 강의 — 재판형 진행(진술·증거조사·재검사·판결)과 5부위 사전/사후 익명 측정, 실시간 결과 보드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
  :root{
    --navy:#0B1730; --navy-2:#132446; --navy-3:#1C3260; --ink:#F3F6FB; --ink-2:#C5D0E2; --ink-3:#8FA3BF;
    --amber:#F5B13D; --amber-2:#FFD27A; --green:#3DD68C; --slate:#8FA3BF; --coral:#FF6B6B; --teal:#5FD3C8;
    --paper:#F7F9FC; --paper-2:#FFFFFF; --paper-3:#E6ECF5; --text:#0B1730; --text-2:#3B4B66; --text-3:#6B7A94; --blue:#1D4ED8;
    --radius:18px; --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Pretendard',system-ui,sans-serif; --serif:'Noto Serif KR','Apple Myungjo','Batang',serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);background:var(--navy);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  body.join{background:var(--paper);color:var(--text);overflow:auto}
  h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
  button{font-family:inherit}
  .num{font-variant-numeric:tabular-nums}
  a{color:inherit}

  /* ===== presenter ===== */
  #stage{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}
  .chrome{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;font-size:14px;color:var(--ink-3);gap:16px}
  .chrome b{color:var(--ink-2);font-weight:700}
  .chrome .clock{display:flex;gap:18px;align-items:center}
  .chrome .clock .over{color:var(--coral)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--navy-2);color:var(--ink-2);font-size:12px;font-weight:700;letter-spacing:.04em}
  .pill.demo{background:#5A3A00;color:var(--amber-2)}
  .pill.live{background:#0E3B2C;color:var(--green)}
  .pill.off{background:#4A1F1F;color:#FFB3B3}
  .pill.manual{background:#2B2F5A;color:#C9CDFF}
  .slide{padding:0 72px 24px;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:auto}
  .slide.top{justify-content:flex-start;padding-top:6px}
  .slide.top h2{font-size:clamp(24px,3.1vw,42px)}
  .slide .eyebrow{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:16px}
  .slide h1{font-size:clamp(40px,6vw,84px);font-weight:900}
  .slide h2{font-size:clamp(28px,3.9vw,54px);font-weight:900}
  .slide h2.serif{font-family:var(--serif)}
  .slide .lead{font-size:clamp(19px,2.1vw,29px);color:var(--ink-2);margin-top:20px;max-width:62ch;line-height:1.45}
  .slide .sub{font-size:clamp(16px,1.6vw,22px);color:var(--ink-3);margin-top:14px;line-height:1.5}
  .cols{display:grid;gap:22px;margin-top:28px}
  .cols.c3{grid-template-columns:repeat(3,1fr)}
  .cols.c2{grid-template-columns:repeat(2,1fr)}
  .cols.c4{grid-template-columns:repeat(4,1fr)}
  .cols.c5{grid-template-columns:repeat(5,1fr)}
  .card{background:var(--navy-2);border-radius:var(--radius);padding:22px 26px;min-height:0}
  .card .k{font-size:13px;letter-spacing:.12em;color:var(--amber);font-weight:700;text-transform:uppercase}
  .card .t{font-size:clamp(18px,1.85vw,26px);font-weight:900;margin-top:8px;line-height:1.25}
  .card .d{font-size:clamp(14px,1.4vw,19px);color:var(--ink-2);margin-top:10px;line-height:1.55}
  .card .d ul{margin:0;padding-left:20px}
  .card .d li{margin:4px 0}
  .issues-grid .card{padding:16px 18px}
  .practice .card{padding:18px 22px}
  .practice .card .d{font-size:clamp(13px,1.3vw,17px)}
  .practice h2{font-size:clamp(26px,3.4vw,46px)}
  .card.warm{background:#3A2A0F}
  .card.warm .k{color:var(--amber-2)}
  .card.cool{background:#0F2E3F}
  .card.cool .k{color:var(--teal)}
  .card.ruling{background:#0E3B2C}
  .card.ruling .k{color:var(--green)}
  .quote{font-size:clamp(20px,2.4vw,34px);font-weight:700;line-height:1.4;color:var(--amber-2);margin-top:24px;max-width:44ch;font-family:var(--serif)}
  .safety{margin-top:22px;font-size:clamp(14px,1.35vw,18px);color:#FFC9C9;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
  .safety::before{content:"!";flex:none;width:26px;height:26px;border-radius:50%;background:#7A2C2C;color:#FFD5D5;display:grid;place-items:center;font-weight:900}
  .footer{display:flex;justify-content:space-between;align-items:center;padding:10px 28px 18px;font-size:13px;color:var(--ink-3)}
  .footer .nav{display:flex;gap:8px}
  .footer button,.iconbtn{background:var(--navy-2);color:var(--ink-2);border:0;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .footer button:hover,.iconbtn:hover{background:var(--navy-3)}
  .footer button:focus-visible,.iconbtn:focus-visible,.scale button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--navy-3);padding:1px 6px;border-radius:5px;color:var(--ink-2)}

  /* issue (쟁점) slide */
  .issue{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;margin-top:22px;align-items:start}
  .ev{display:grid;gap:10px}
  .ev .e{background:var(--navy-2);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
  .ev .e .b{font-size:12px;font-weight:900;letter-spacing:.08em;padding:4px 8px;border-radius:6px;background:var(--navy-3);color:var(--ink-2);white-space:nowrap}
  .ev .e .b.lit{background:#2B2F5A;color:#C9CDFF}
  .ev .e .b.site{background:#0F2E3F;color:var(--teal)}
  .ev .e .b.exp{background:#3A2A0F;color:var(--amber-2)}
  .ev .e .x{font-size:clamp(14px,1.35vw,18px);line-height:1.5;color:var(--ink)}
  .ev .e .s{font-size:12.5px;color:var(--ink-3);margin-top:4px}
  .rulingbar{margin-top:20px;background:#0E3B2C;border-radius:16px;padding:18px 22px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
  .rulingbar .k{font-size:13px;letter-spacing:.12em;color:var(--green);font-weight:900}
  .rulingbar .t{font-size:clamp(17px,1.9vw,26px);font-weight:900;line-height:1.35}
  .rulingbar .a{font-size:clamp(13px,1.3vw,17px);color:var(--ink-2);margin-top:6px}
  .qno{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--amber);color:var(--navy);font-weight:900;font-size:22px;margin-right:12px;vertical-align:middle}

  /* part practice */
  .hyp{margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .hyp .tag{font-size:12px;font-weight:900;letter-spacing:.1em;padding:5px 9px;border-radius:6px;background:var(--navy-3);color:var(--amber)}
  .hyp .x{font-size:clamp(16px,1.7vw,23px);color:var(--ink-2)}
  .evchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .evchips span{font-size:clamp(12px,1.15vw,15px);background:var(--navy-2);color:var(--ink-2);padding:6px 10px;border-radius:8px;line-height:1.4}
  .evchips span b{color:var(--teal);font-weight:900;margin-right:6px}

  /* QR slide */
  .qrwrap{display:grid;grid-template-columns:minmax(280px,400px) 1fr;gap:48px;align-items:center;margin-top:22px}
  .qrbox{background:#fff;border-radius:24px;padding:20px;display:grid;place-items:center;aspect-ratio:1/1;width:100%;max-width:400px}
  .qrbox canvas{width:100%;height:auto;image-rendering:pixelated}
  .qrurl{font-size:12.5px;color:var(--ink-3);margin-top:10px;word-break:break-all;max-width:400px}
  .board{display:grid;gap:16px}
  .stat{background:var(--navy-2);border-radius:var(--radius);padding:20px 24px}
  .stat .l{font-size:14px;color:var(--ink-3);font-weight:700;letter-spacing:.06em}
  .stat .v{font-size:clamp(40px,5.4vw,78px);font-weight:900;line-height:1.05;margin-top:6px}
  .stat .v small{font-size:.38em;color:var(--ink-3);font-weight:700;margin-left:8px}
  .stat .v.good{color:var(--green)}
  .stat .v.amber{color:var(--amber)}
  .stat .v.bad{color:var(--coral)}
  .stat .m{font-size:15px;color:var(--ink-2);margin-top:8px;line-height:1.5}
  .stat.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px}
  .stat.row .arrow{font-size:40px;color:var(--ink-3)}
  .dist{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;align-items:end;height:100px;margin-top:8px}
  .dist .bar{background:var(--navy-3);border-radius:6px 6px 2px 2px;position:relative;min-height:3px}
  .dist .bar.hot{background:var(--amber)}
  .dist .bar span{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:12px;color:var(--ink-2);padding-bottom:3px}
  .dist .bar i{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:12px;color:var(--ink-3);font-style:normal;padding-top:4px}
  .waiting{font-size:clamp(18px,2vw,26px);color:var(--ink-3)}
  .statement{margin-top:14px;font-size:clamp(15px,1.5vw,20px);color:var(--ink-2);line-height:1.5;max-width:60ch}

  /* verdict (finale) */
  .finale-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;margin-top:20px;align-items:start}
  .big{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .big .stat{padding:14px 20px}
  .big .stat .v{font-size:clamp(36px,4.4vw,64px)}
  table.parts{width:100%;border-collapse:collapse;font-size:clamp(13px,1.35vw,18px);margin-top:4px}
  table.parts th,table.parts td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--navy-3)}
  table.parts th{color:var(--ink-3);font-weight:700;font-size:.85em;letter-spacing:.06em}
  table.parts td:first-child,table.parts th:first-child{text-align:left;font-weight:700}
  table.parts .good{color:var(--green);font-weight:900}
  .barrow{display:grid;grid-template-columns:130px 1fr 64px;gap:12px;align-items:center;margin-top:6px;font-size:clamp(13px,1.3vw,17px)}
  .barrow .track{height:20px;background:var(--navy-3);border-radius:8px;overflow:hidden}
  .barrow .fill{height:100%;background:var(--green);width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
  .barrow .fill.same{background:var(--slate)}
  .verdictdoc{margin-top:14px;background:var(--navy-2);border-radius:16px;padding:16px 20px;font-size:clamp(13px,1.3vw,17px);line-height:1.6;color:var(--ink-2);font-family:var(--serif)}
  .verdictdoc b{color:var(--ink)}
  .disclaimer{margin-top:16px;font-size:13.5px;color:var(--ink-3);line-height:1.5;max-width:90ch}
  .reveal{display:grid;place-items:center;min-height:38vh}
  .reveal button{font-size:clamp(22px,2.6vw,36px);font-weight:900;padding:22px 54px;border-radius:999px;border:0;background:var(--amber);color:var(--navy);cursor:pointer;box-shadow:0 20px 60px rgba(245,177,61,.25);font-family:var(--serif)}
  .reveal button:hover{background:var(--amber-2)}
  .refs{font-size:clamp(13px,1.3vw,17px);color:var(--ink-2);line-height:1.6;margin-top:18px;columns:2;column-gap:40px}
  .refs div{break-inside:avoid;margin-bottom:8px}
  .refs .c{font-size:11px;color:var(--ink-3);margin-left:6px}

  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(5,10,24,.78);display:grid;place-items:center;z-index:50;padding:24px}
  .panel{background:var(--navy-2);border-radius:22px;padding:28px 30px;width:min(880px,96vw);max-height:92vh;overflow:auto;color:var(--ink)}
  .panel h3{font-size:22px;font-weight:900;margin-bottom:16px}
  .panel label{display:block;font-size:13px;color:var(--ink-3);font-weight:700;margin:14px 0 6px;letter-spacing:.04em}
  .panel input[type=text],.panel input[type=url],.panel input[type=number],.panel textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--navy-3);background:var(--navy);color:var(--ink);font-size:15px;font-family:inherit}
  .panel textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .panel .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
  .panel .row button{background:var(--amber);color:var(--navy);border:0;border-radius:10px;padding:10px 16px;font-weight:900;cursor:pointer}
  .panel .row button.ghost{background:var(--navy-3);color:var(--ink-2)}
  .panel .hint{font-size:13px;color:var(--ink-3);line-height:1.55;margin-top:8px}
  .panel .ok{color:var(--green);font-weight:700}
  .panel .err{color:var(--coral);font-weight:700}
  .notes{position:fixed;right:24px;bottom:70px;width:min(520px,44vw);background:rgba(19,36,70,.96);border-radius:16px;padding:18px 20px;font-size:15px;line-height:1.6;color:var(--ink-2);z-index:40;box-shadow:0 20px 60px rgba(0,0,0,.4);max-height:60vh;overflow:auto}
  .notes h4{margin:0 0 8px;font-size:13px;letter-spacing:.1em;color:var(--amber)}
  .toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--amber);color:var(--navy);padding:10px 18px;border-radius:999px;font-weight:900;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .manual-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .manual-grid label{margin:0 0 6px}

  /* ===== participant (join) ===== */
  .join-wrap{max-width:520px;margin:0 auto;padding:22px 18px 60px}
  .join-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-3);font-weight:700;letter-spacing:.04em}
  .join-card{background:var(--paper-2);border-radius:22px;padding:24px 20px;margin-top:16px;box-shadow:0 10px 40px rgba(11,23,48,.08)}
  .join-card .phase{display:inline-block;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:900;letter-spacing:.06em}
  .join-card .phase.pre{background:#E8EFFF;color:var(--blue)}
  .join-card .phase.post{background:#E6F8EF;color:#0B7A47}
  .join-card h1{font-size:30px;font-weight:900;margin-top:12px}
  .join-card .q{font-size:17px;color:var(--text-2);margin-top:10px;line-height:1.5}
  .scale{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;margin-top:20px}
  .scale button{aspect-ratio:1/1.35;min-width:0;border-radius:9px;border:2px solid var(--paper-3);background:#fff;font-size:15px;font-weight:900;color:var(--text);cursor:pointer;padding:0;letter-spacing:-.04em}
  .scale button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .scale .ends{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chips button{border:2px solid var(--paper-3);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:700;color:var(--text-2);cursor:pointer}
  .chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .submit{width:100%;margin-top:22px;padding:18px;border-radius:14px;border:0;background:var(--navy);color:#fff;font-size:19px;font-weight:900;cursor:pointer}
  .submit[disabled]{background:#B9C3D6;cursor:not-allowed}
  .fine{font-size:12.5px;color:var(--text-3);margin-top:14px;line-height:1.55}
  .done{text-align:center;padding:14px 0 4px}
  .done .check{width:72px;height:72px;border-radius:50%;background:#E6F8EF;color:#0B7A47;display:grid;place-items:center;font-size:36px;font-weight:900;margin:0 auto 12px}
  .done h2{font-size:26px;font-weight:900}
  .done .mine{margin-top:16px;background:var(--paper);border-radius:14px;padding:14px;font-size:16px;color:var(--text-2)}
  .done .mine b{font-size:22px;color:var(--text)}
  .done .card-verdict{margin-top:14px;text-align:left;background:#FFF8E8;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;color:#4A3A10;font-family:var(--serif)}
  .group{margin-top:16px;border-top:1px dashed var(--paper-3);padding-top:14px}
  .group .l{font-size:13px;color:var(--text-3);font-weight:700;letter-spacing:.06em}
  .group .v{font-size:34px;font-weight:900;color:var(--navy);margin-top:4px}
  .group .v.good{color:#0B7A47}
  .group .m{font-size:13px;color:var(--text-3);margin-top:4px}
  .join-error{background:#FFF0F0;color:#8A1F1F;border-radius:14px;padding:16px;font-weight:700;line-height:1.5}

  @media (max-width:900px){
    .slide{padding:0 28px 16px}
    .cols.c3,.cols.c5,.cols.c2,.cols.c4{grid-template-columns:1fr}
    .qrwrap,.issue,.finale-grid{grid-template-columns:1fr}
    .refs{columns:1}
  }
  @media (prefers-reduced-motion:reduce){ .barrow .fill{transition:none} }
</style>

</head>

<div id="app"></div>

for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]

/* --- QRPolynomial --- */
(function(){var module={};

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

	get : function(index) {
		return this.num[index];
	},

		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);

<script>window.SPEC={"title":"몸의 법정 — 다섯 부위 사건 심리","subtitle":"사전 QR 진술 → 증거조사 → 재검사 → 각자 판결. 수원가정법원 2회차 점심 50분, 의자와 공 하나, 매트 없음. 강사는 감정인, 재판장은 참가자 각자.","court_metaphor":{"재판장":"참가자 각자 — 자기 몸 사건의 유일한 판단권자. 강사는 판단하지 않고 증거만 제출한다","감정인(전문가 증인)":"강사 김진 — 가설과 증거를 제출하는 사람. 의료인이 아니며 진단·치료를 하지 않고, 이 방법으로 일하는 이해관계인임을 스스로 고지한다","입증책임":"증명은 주장하는 쪽, 즉 감정인의 몫이다. 참가자는 증명할 의무 없이 판단만 한다","사건 접수·진술":"각 부위 사전 QR. '지금 이 순간, 방금 한 체크 동작에서 느낀 불편감 0~10'을 익명 제출 = 당사자 본인 진술. 0도 진술이다","증거능력 고지":"rules 슬라이드 — 자기보고·대조군 없음·기대효과(비맹검)·단회 측정·감정인 이해관계를 먼저 인정","쟁점 정리":"판사의 질문 7개를 쟁점 1~7로 번호 매겨 화면에 공개하고, 어디서 답하는지 예고","주장(가설)":"부위마다 '피해자는 아픈 곳, 유력한 용의자는 굳은 곳' 한 문장 — 목→등, 허리→엉덩이, 어깨→승모근·겨드랑이, 무릎→발·앞허벅지, 발→아치. 대질 전에는 '용의자', 판결은 재판장 몫","서증(문헌)":"IASP 2020, WHO 2020, NICE NG59 2016, 고용노동부 근골격계부담작업 고시 — 각 confidence 표기, 발화는 부위당 1개만","검증(현장 확인)":"부위별 자가 확인 동작 — 회전·만세·3걸음·일어서기. 재판장이 자기 몸을 직접 확인","감정(개입 실험)":"10초 리셋을 한쪽만 실시. 안 푼 쪽이 자기 대조군","대질(좌우 비교)":"안 푼 쪽 vs 푼 쪽. 한쪽만 푸는 것은 기대효과를 없애지 못한다 — 어느 쪽을 풀었는지 본인이 알기 때문이다. 다만 시간·피로·기분처럼 양쪽에 동시에 걸리는 요인을 빼고, '전체가 좋아진 기분'과 '푼 쪽만 다른 감각'을 구분하는 데는 도움이 된다. 가림 실험은 오늘 하지 않으므로 이 한계는 판결 한계에 남긴다","대조군":"안 푼 쪽(반대편). 기관 차원의 대조군은 없음을 고지. 반대쪽은 사후 QR 입력 뒤에만 푼다","재검사(재진술)":"사후 QR. 같은 부위·같은 동작 직후·같은 0~10 기준으로 다시 진술","사실인정":"각자의 숫자 변화(사전→사후)와 좌우 차이. 화면 평균은 참고, 사실인정은 개인 숫자로","판결(주문·이유·조건·한계)":"피날레 4단 구성. 주문은 '달라지게 했다고 볼 여지가 있다'까지만","집행":"한 시간에 한 번 1분 리셋 + 서기·걷기·앉기 5%. 판결은 집행돼야 효력이 있다","재심":"재발 시 같은 0~10 기준으로 재측정 후 리셋 반복. '효과는 돌아온다'를 정직하게 고지","이송(관할 위반)":"저림·힘 빠짐·대소변 장애·발열·야간통·외상·급성 심한 통증 = 오늘 기억할 대표 일곱 가지. 이 밖에 원인 모를 체중 감소·암 병력·스테로이드 장기 복용·2~4주 이상 지속·악화도 의료기관 평가가 먼저. 최종 판단은 의료인의 몫","각하(심리 생략)":"수술 직후·급성·부종·열감·임신 중·항응고제 복용·멍 잘 드는 분·골다공증 진단·발 감각 저하는 압박 실습을 생략하고 동작만. 뛰기는 무릎 통증·임신·균형 불안·구두 착용 시 대체 동작","피고인(용의자→범인)":"굳은 근육 — 등 상부·엉덩이·승모근·겨드랑이·앞허벅지·발 아치. 아픈 부위는 피해자. 대질 뒤 '이제 범인이라 불러도 되겠습니까 — 판단은 재판장님이'로 회수","심봤다":"압박 시 아픈 지점을 찾았을 때의 구호 = '용의자 검거'. 세게 누르라는 뜻이 아니다","벌금(유머 장치)":"숨 참기 1만 원, 고개 끄덕임 1만 원(내 몸을 인지했는가를 묻는 게임, 끄덕이지 말라는 처방 아님), 발 아치 붕괴 1만 원. 징수관은 옆자리 재판장. 실제 징수 없음, 폐정 때 공(실습 교구)으로 대납 결산","의사봉":"공을 책상에 한 번 톡 — 부위마다 '증거조사 개시' 선언","5%만":"집행 강도 — 95%는 업무 생각, 5%만 몸에","1층·2층·3층":"발=1층, 무릎=2층, 엉덩이·골반=3층. 아래층이 위층 사건에 영향을 준다는 가설","강도 기준":"'숨이 쉬어지는 아픔까지, 숨이 막히면 너무 센 것' — 연구 근거가 아니라 감정인의 현장 기준. 숫자 척도는 쓰지 않는다(QR 0~10과 혼동 방지)","용어 통일":"형사 비유로 통일(피해자·용의자·검거). 원고·피고(민사) 용어, '검사·진단·치료·환자' 단어는 쓰지 않는다"},"slides":[{"id":"open","type":"open","min":1,"title":"개정 — 오늘 재판장은 여러분 각자입니다","eyebrow":"몸의 법정 · 사건번호 2026-몸-2 · 개정","lead":"다섯 건을 심리합니다 — 발·목·어깨·허리·무릎. 저는 판결하지 않습니다. 감정인으로서 가설과 증거만 제출하고, 판단은 각자 자기 몸에서 하십니다.","cards":[{"k":"진술","t":"사전 QR · 0~10","d":"숫자 하나와 기기별 무작위 번호만 받습니다(익명 클라우드 저장). 집계만 공개, 원자료는 30일 내 삭제."},{"k":"증거조사","t":"문헌 + 확인 + 실험","d":"한쪽만 풀고 안 푼 쪽과 대질합니다. 반대편이 대조군입니다."},{"k":"재검사·판결","t":"사후 QR → 각자 판결","d":"달라졌는지, 같은지, 더 불편한지 — 숫자로 판단합니다."}],"quote":"\"통증은 실제 또는 잠재적 조직 손상과 관련되거나 그와 유사한, 불쾌한 감각적·정서적 경험이다.\" — IASP 통증 정의 개정(2020). 통증은 실재합니다. 다만 손상의 크기와 같은 뜻은 아닙니다.","ruling":"이 법정은 통증이 허상이라고 말하지 않는다. 통증은 실재하며, 오늘은 그것이 '달라지는지'만 확인한다.","action":"목·어깨·허리·무릎·발 중 불편감 1 이상인 부위가 하나라도 있는 분 손. 그 숫자를 기억하세요 — 오늘 다섯 번 다시 적습니다.","notes":"[0:00–0:15] 첫 문장 그대로, 낮고 천천히: \"지금부터 사건번호 2026-몸-2, 통증 사건 심리를 개정합니다. 오늘 재판장은 여러분 각자, 저는 감정인입니다.\" 2초 침묵. [0:15–0:30] 감정인 소개 12초, 문구 고정: \"스포츠의학 박사, 운동·재활운동 지도 20년, 기업·공공기관 강의. 저는 의료인이 아니며 진단·치료를 하지 않습니다.\" 무릎 연골 이식 수술 경험은 무릎 사건에서 30초 재등장. 화면 어디에도 '치료·환자·진단·검사' 단어 금지. [0:30–0:50] 카드 3장 훑기. 진술 카드에서 데이터 한 문장: \"숫자 하나와 기기 무작위 번호만, 외부 클라우드에 익명 저장, 집계만 공개·기관 공유, 원자료는 30일 내 삭제.\" (담당자에게 사전 서면 고지, 참가자 페이지의 연령대 등 선택 항목은 끄거나 '선택' 표기.) \"감정인은 이해관계가 있는 증인이라 여러분이 먼저 제 증거능력을 심사하셔야 합니다. 다음 장에서 제가 스스로 고지하겠습니다.\" [0:50–1:00] 손들기 후 바로 다음 장. 금지: '통증은 허상', '즉시 낫는다', '90%가 아프다'. 콜백 전제 주의: 2회차는 다른 참가자. '1회차 분들은 아시죠'류 발화 금지. 겹치는 분이 있어도 지목하지 않는다. 공은 '선물'이 아니라 '기관과 사전 협의된 실습 교구'로만 호칭(비용 처리는 담당자와 서면 확정)."},{"id":"rules","type":"rules","min":1.5,"title":"증거능력 고지 — 반박부터 인정하겠습니다","eyebrow":"증거능력 심사 · 감정인 자기 고지 · 쟁점 3","question_no":3,"lead":"판사님들이 속으로 던지실 반박을 제가 먼저 인정합니다. 그래서 오늘의 기준은 '즉시 낫는다'가 아니라 '달라지는지 확인한다'입니다.","cards":[{"k":"한계 1","t":"자기보고 · 직후 · 1회","d":"0~10은 본인 진술입니다. 기분·기억이 섞이고, 내일까지 가는지는 별개 쟁점입니다."},{"k":"한계 2","t":"대조군 없음 → 한쪽만","d":"기관 차원 대조군은 없습니다. 한쪽만 풀어 시간·피로·기분처럼 양쪽에 걸리는 요인만 뺍니다."},{"k":"한계 3","t":"기대효과는 남습니다","d":"한쪽만 풀어도 어느 쪽을 풀었는지 본인이 압니다(비맹검). 가림 실험은 오늘 하지 않습니다."},{"k":"한계 4","t":"감정인의 이해관계","d":"저는 이 방법으로 일하는 사람입니다. 그래서 효과를 선언하지 않고 여러분이 측정합니다."}],"safety":"쟁점 3의 답 — 오늘 기억할 대표 일곱 가지(관할 밖): 저림 · 힘 빠짐 · 대소변 장애 · 발열 · 야간통 · 외상 · 급성 심한 통증. 하나라도 있으면 오늘 압박은 생략하고 의료기관 평가가 먼저입니다. 일곱 가지가 없어도 2~4주 이상 지속·악화, 원인 모를 체중 감소, 암 병력, 스테로이드 장기 복용은 평가 대상. 목·어깨 통증에 가슴 답답함·식은땀이 함께 오면 실습이 아니라 응급입니다. 각하(압박 생략, 동작만): 수술 직후 · 부종·열감 · 임신 중 · 항응고제 복용·멍 잘 드는 분 · 골다공증 진단 · 발 감각 저하. 뛰기 생략 대상(무릎 통증·임신·균형 불안·구두)은 대체 동작. 관할 안(오늘 실습 참가 기준 — 가이드라인이 아닌 감정인의 실무 기준): 자세를 바꾸면 덜해지고, 눌렀을 때 '시원한 불편감'이며, 숨이 쉬어지는 아픔까지. 숨이 막히면 너무 센 것입니다. 이 목록은 오늘 참가 여부용이며, 병원 갈지 말지의 최종 판단은 의료인의 몫입니다.","evidence":[{"kind":"문헌","text":"요통 진료에서 심각한 원인을 시사하는 징후(레드플래그)는 별도 평가 대상이며, 그 외 대부분은 일상 활동 지속과 운동을 권고. 요통 지침이며 다른 부위는 같은 원칙을 유추 적용","source":"NICE NG59 Low back pain and sciatica (2016) · 타 부위 유추 medium","confidence":"high"},{"kind":"문헌","text":"통증과 통각은 다른 현상이며 통증은 감각 신경 활동만으로 추론할 수 없다 — 그래서 세기만으로 가르지 않고 동반 징후를 함께 본다(관할 기준 도출은 감정인의 적용)","source":"IASP 통증 정의 개정 (2020) 주석","confidence":"high"},{"kind":"문헌","text":"기대효과·평균으로의 회귀·자기보고 편향·비맹검은 전후 비교의 대표적 교란 요인. 레드플래그는 선별 도구이지 배제 도구가 아님","source":"연구방법론 · 임상 가이드라인 일반 원칙","confidence":"high"},{"kind":"실무 기준","text":"'자세 바꾸면 덜함·시원한 불편감·숨이 쉬어지는 강도'는 연구 근거가 아니라 오늘 실습 참가를 가르는 감정인의 현장 기준","source":"감정인 현장 기준 (근거 문헌 아님)","confidence":"medium"}],"counter":"\"강사가 좋아진다고 했으니 좋아졌다고 느끼는 것 아닌가?\" — 맞을 수 있습니다. 한쪽만 풀어도 기대는 남습니다 — 어느 쪽을 풀었는지 본인이 아니까요. 한쪽만 푸는 이유는 두 가지입니다. ① 시간·피로·기분처럼 양쪽에 동시에 걸리는 요인을 빼기 위해, ② 방법을 배우는 동안 반대편을 원래 상태로 보존하기 위해. 그래서 오늘의 주문은 '효과가 있다'가 아니라 '달라졌다고 볼 여지가 있다'까지입니다.","ruling":"오늘의 결과는 '교육 직후 익명 자기보고, 대조군 없음, 비맹검, 의학적 효과 아님'이라는 꼬리표를 달고만 공개된다.","action":"각 부위 사전 QR 전 10초 자가 확인: 일곱 가지에 하나라도 해당되면 그 부위는 '동작만'. 손 들 필요 없이 본인만 알면 됩니다.","notes":"[0:00–0:40] 카드는 읽지 않고 한 줄씩 가리키며: \"자기보고, 대조군 없음, 기대효과, 그리고 제 이해관계. 법정에서 증거능력 없는 증거로 판결하지 않으시죠. 제가 먼저 고지합니다.\" 한계 3 발화 고정: \"한쪽만 푸는 것은 기대효과를 없애지 못합니다 — 어느 쪽을 풀었는지 본인이 아니까요. 다만 '전체가 좋아진 기분'과 '푼 쪽만 다른 감각'을 구분하는 데는 도움이 됩니다. 눈을 가리는 실험은 오늘 하지 않으니 이 한계는 판결 한계에 그대로 남깁니다.\" [0:40–1:10] 쟁점 3 답: \"움직여도 되는 것과 병원이 먼저인 것 — 오늘 기억할 대표 일곱 가지입니다. 저림, 힘 빠짐, 대소변, 발열, 야간통, 외상, 급성. 이 밖에도 원인 모를 체중 감소, 암 병력, 스테로이드 장기 복용은 의료기관이 먼저입니다. 이 목록은 오늘 실습 참가 여부용이고, 병원 갈지 말지의 최종 판단은 의료인의 몫입니다.\" 해당자는 손 들지 않아도 됨. [1:10–1:30] 강도 기준 1회 선언, 숫자 없이: \"숨이 쉬어지는 아픔까지가 정답. 숨 막히면 너무 센 것. 이건 연구 근거가 아니라 제 현장 기준입니다.\" 이후 부위에서는 신호어 '숨!'만. 관할 안 세 가지도 '감정인의 실무 기준'이라고 층위를 밝힌다. '진단·검사'라는 단어는 쓰지 않는다. 1회차 Q&A에 협착 진단자가 있었으나 개별 지목 금지, 전체 규칙으로만 처리. 마지막 문장: \"그 이상은 말하지 않겠습니다.\""},{"id":"issues","type":"issues","min":0.5,"title":"쟁점 정리 — 오늘 답할 판사의 질문 7개","eyebrow":"쟁점 정리 · 어디서 답하는가","lead":"쟁점 3은 방금 답했습니다. 1·2는 다음 두 장, 4는 목·허리·폐정, 5는 목·어깨·허리, 6은 무릎·판결, 7은 폐정에서 — 별도 시간 없이 심리 안에서 답합니다.","ruling":"쟁점 7개는 모두 '한 문장 결론 + 근거 + 오늘 현장에서 확인하는 방법'으로 답한다.","action":"가장 궁금한 쟁점 번호 하나를 정해 두세요. 폐정 때 그 답이 본인 몸에서 확인됐는지 판단합니다.","notes":"[0:00–0:30] 화면의 쟁점 카드 7장은 answers에서 자동 생성된다(이 슬라이드에 cards를 넣지 말 것 — 중복 표시됨). 읽지 말고 화면을 보게 한다. \"판사님들이 사건 심리 전에 쟁점부터 정리하시듯, 오늘 답할 질문 7개입니다. 3번은 방금 답했습니다. 답을 못 하면 감정인 기피 사유입니다.\" 어디서 답하는지는 lead 한 줄로. 웃음 1회만. 바로 다음 장. 데모 모드로 화면 확인 필수."},{"id":"q1","type":"issue","min":0.75,"question_no":1,"title":"쟁점 1 — 왜 오래 일하면 목과 허리가 아픈가","eyebrow":"쟁점 1 · 가설과 서증","hypothesis":"가설: 범인은 '나쁜 자세'가 아니라 '한 자세'입니다. 오래 같은 자세로 있으면 목·허리를 받치는 근육이 쉬지 못하고 계속 일하는 정적 부하가 쌓입니다. 기록 검토·경청·집중은 이 정적 부하가 특히 긴 직무라는 가설입니다.","evidence":[{"kind":"문헌","text":"하루 4시간 이상 집중적 키보드·마우스 조작 작업을 근골격계부담작업으로 지정해 사업주 유해요인조사 의무 부과 — 장시간 고정 사무작업의 한 유형을 국가 기준이 부담작업으로 지정(기록 검토는 직접 대상 아님, 취지만 원용)","source":"고용노동부 「근골격계부담작업의 범위 및 유해요인조사 방법에 관한 고시」","confidence":"high"},{"kind":"문헌","text":"성인에게 좌식 시간을 줄이고 어떤 강도의 활동으로든 대체할 것을 권고","source":"WHO 신체활동 및 좌식행동 가이드라인 (2020)","confidence":"high"},{"kind":"문헌","text":"자세 유지 근육이 낮은 강도로 장시간 수축하면 혈류가 줄고 피로·뻐근함이 누적된다 — 근생리학 일반 원칙, 구체 수치는 인용하지 않음","source":"일반 원칙(정적 부하)","confidence":"medium"}],"counter":"\"오래 써서 닳은 것(퇴행) 아닌가?\" — 영상 소견은 통증이 없는 사람에게도 흔하다는 것이 일반 원칙이고, 소견과 통증은 같은 말이 아닙니다(IASP 2020). 오늘은 소견을 바꾸는 게 아니라 '지금 불편감'이 달라지는지 봅니다. 개별 원인은 의료기관 판단입니다.","ruling":"오래 일해서라기보다 오래 '같은 자세로' 일해서일 가능성이 큽니다 — 오늘 그 가설을 확인합니다. 해법은 쉬는 시간이 아니라 자세를 바꾸는 능력입니다.","action":"목 사건에서 확인: 목을 만지지 않고 등받이에 등 상부만 붙여 등을 세운 뒤 좌우 회전을 다시 합니다. 목을 건드리지 않았는데 회전 느낌이 달라지면, 적어도 '자세가 목 감각에 영향을 준다'는 것은 각자 확인한 셈입니다.","notes":"[0:00–0:25] \"판사님, 하루에 기록을 몇 시간 보십니까?\" 고시 발화 고정: \"고용노동부 고시는 하루 4시간 이상 키보드·마우스를 집중 조작하는 작업을 '근골격계부담작업'으로 정해 사업주에게 유해요인조사를 하게 합니다. 기록 검토가 그 조문에 바로 해당한다고 말씀드리는 건 아닙니다. 다만 '오래 같은 자세'를 국가가 부담 요인으로 보는 취지는 같습니다.\" (고시 제4호 '임의로 자세를 바꿀 수 없는 조건에서 2시간 이상 목·허리를 구부리거나 트는 작업'은 '조건부'로만 언급 가능, 판사 업무 해당 여부는 단정하지 않음.) \"범인은 나쁜 자세가 아니라 한 자세라는 가설입니다. 근육이 교대 근무를 못 한 겁니다.\" [0:25–0:45] 쟁점 2 실험 예고 후 즉시 시작: \"지금부터 60초, 가장 바르다고 생각하는 자세로 앉아 계십시오. 제가 다음 장을 말하는 동안 유지합니다.\" 근거는 기관명+연도만, 수치는 고시 '4시간'만. 금지: '디스크가 생긴다' → '부담이 쌓입니다', '국가가 인정했다' → '고시의 취지'."},{"id":"q2","type":"issue","min":0.75,"question_no":2,"title":"쟁점 2 — 좋은 의자·바른 자세만으로 안 되는 이유","eyebrow":"쟁점 2 · 가설과 60초 실험","hypothesis":"가설: 좋은 의자는 좋은 변호사입니다 — 부담을 잘 나눠 주지만 대신 걸어 주지는 않습니다. 어떤 좋은 자세도 오래 고정되면 다시 정적 부하가 되고, 굳은 엉덩이·등으로는 바른 자세를 만들기 어렵다는 가설입니다. 가장 좋은 자세는 '다음 자세'입니다.","evidence":[{"kind":"실험","text":"지금 60초 — 가장 바르다고 생각하는 자세를 유지한 뒤 어디가 먼저 뻐근한지 기억. 같은 의자에서 실습 후 점수가 달라지면 의자가 아니라 근육이 변수","source":"현장 실험(자기 관찰)","confidence":"medium"},{"kind":"문헌","text":"요통에 일상 활동 지속과 운동을 권고 — 고정이 아니라 움직임이 표준(요통 지침, 타 부위는 유추)","source":"NICE NG59 (2016)","confidence":"high"},{"kind":"문헌","text":"모든 사람에게 맞는 단일한 '이상적 자세'의 근거는 약하며 자세를 자주 바꾸는 것이 더 중요하다는 견해가 전문 문헌에서 제시됨","source":"일반 원칙(자세와 통증)","confidence":"medium"}],"counter":"\"비싼 의자를 사면 되지 않나?\" — 의자는 도움이 됩니다. 다만 의자는 '하중 배분'을 바꾸고, 오늘 실험은 '근육 상태'를 바꿉니다. 같은 의자에서 느낌이 달라지면 의자가 결정 변수가 아니었다는 뜻입니다.","ruling":"의자와 자세는 필요조건이지 충분조건이 아니다. 바른 자세는 지키는 것이 아니라 바꾸는 것이다 — 가장 좋은 자세는 다음 자세.","action":"방금 60초 — 어디가 먼저 뻐근했습니까? 그것이 오늘 첫 진술입니다. 허리 사건에서 같은 의자에 앉은 채 한쪽 엉덩이만 풉니다. 의자는 그대로인데 다리 들기·3걸음이 좌우로 다르면 의자가 변수가 아니었다는 증거입니다.","notes":"[0:00–0:30] 60초 실험 진행 중 — 근거 두 개를 기관명+연도로만 읽는다(논문 저자명은 화면·발화에서 제외, references에만). \"좋은 의자는 좋은 변호사입니다. 부담을 나눠 주죠. 그런데 변호사가 대신 걸어 주진 않습니다.\" [0:30–0:45] \"자, 어디가 먼저 뻐근합니까? 목? 어깨? 바른 자세로 60초 버틴 것도 정적 부하입니다. 가장 좋은 자세는 다음 자세입니다. 이 문장 하나 기억하십시오.\" 대비 문장(아무렇지 않은 분이 많을 때): \"60초에 아무렇지 않으신 분 — 정상입니다. 고시가 부담작업으로 보는 기준은 같은 자세 4시간입니다. 그 4시간을 60초로 줄여 보여드릴 수는 없으니, 허리 사건에서 다른 방식(같은 의자, 한쪽만)으로 확인합니다.\" 금지: '60초 이상 고정되면 ~된다'류 수치 단정 — '오래 고정되면'으로."},{"id":"bridge","type":"bridge","min":0.5,"title":"심리 개시 — 다섯 사건, 같은 절차","eyebrow":"심리 절차 · 부위마다 8분","lead":"1층(발)부터 올라갑니다. 진술(사전 QR 1.5분) → 확인·감정·대질(실습 5분) → 재진술(사후 QR 1.5분). 실험은 한쪽만 — 반대편이 대조군입니다.","cards":[{"k":"규칙 1 · 대조군","t":"한쪽만 풉니다","d":"반대쪽은 사후 QR 입력 뒤 45초 속성. 기대는 남지만, 양쪽에 걸리는 요인은 뺍니다 — 증거 보전."},{"k":"규칙 2 · 호흡","t":"누르고 5초, 소리 나게 내쉬기","d":"굴리지 않습니다. 옆사람 귀에 들려야 유효. 안 들리면 옆자리 재판장이 벌금 1만 원(실제 징수 없음)."},{"k":"규칙 3 · 아플 때","t":"내쉬고 → 미간 풀고 → 심봤다","d":"'통증은 근육의 집 주소'는 비유입니다. 주소를 찾으면 '심봤다'. 세게가 아니라 숨이 쉬어지는 강도 — 숨!"}],"ruling":"한쪽만 푸는 것은 게으름이 아니라 실험 설계다. 기대효과는 없애지 못하지만 반대쪽을 원래 상태로 보존한다. 반대쪽은 재검사 뒤에 푼다.","action":"콜앤리스폰스: \"아플 때 어떻게 한다?\" → \"내쉬고, 미간 풀고, 심봤다.\" 공을 손에 쥐고 첫 사건(발) 사전 QR로.","notes":"[0:00–0:10] 공을 책상에 한 번 톡(의사봉). \"증거조사를 개시합니다.\" 이 리듬을 부위마다 반복. [0:10–0:25] 세 규칙을 콜앤리스폰스로 고정: \"아플 때 어떻게 한다?\" → \"내쉬고, 미간 풀고, 심봤다.\" 규칙 1 발화: \"한쪽만 풀어도 기대는 남습니다. 대신 시간·피로·기분처럼 양쪽에 걸리는 요인은 빠지고, 반대편은 원래 상태로 보존됩니다.\" [0:25–0:30] 벌금 선포: \"숨 참기 1만 원, 고개 끄덕임 1만 원, 발 아치 붕괴 1만 원. 법원이니 벌금은 익숙하시죠. 징수관은 옆자리 재판장님. 실제 징수는 없습니다.\" 끄덕임 벌금은 '내 몸을 인지했는가' 게임이지 끄덕이지 말라는 처방이 아님을 목 사건에서 밝힌다. 반대쪽 규칙을 반드시 말한다: \"반대쪽은 재검사 숫자를 넣은 다음에 풉니다. 그 전에 풀면 대조군이 사라집니다.\" 사후 QR 숫자는 '누를 때 아픔'이 아니라 '동작 시 불편감'임을 부위마다 한 번씩 말한다."},{"id":"verdict","type":"verdict","min":2.5,"title":"판결 — 오늘 이 강의장은 얼마나 달라졌습니까","eyebrow":"판결 · LIVE RESULT · 쟁점 6","question_no":6,"lead":"화면의 평균은 참고, 판결은 각자의 숫자로. 쟁점 6 — 오늘 체육관식 운동은 0분이었습니다. 운동은 체육관 1시간, 관리는 체육관 밖 23시간입니다.","hypothesis":"쟁점 6 — 운동은 체육관 1시간의 '양', 관리는 체육관 밖 23시간의 '상태'입니다. 오늘 체육관식 운동(근력·유산소)은 하지 않았습니다. 풀고, 숨 쉬고, 자세를 바꾸고, 짧은 동작으로 확인만 했습니다. 그런데 숫자가 달라졌다면 — 그것이 '관리'가 무엇인지에 대한 단서입니다.","evidence":[{"kind":"문헌","text":"신체활동 권고(주 150~300분 중강도 + 근력 주 2회)와 좌식행동 감소 권고는 별개 항목 — 운동을 채워도 좌식 시간은 따로 줄여야 함","source":"WHO 신체활동 및 좌식행동 가이드라인 (2020)","confidence":"high"},{"kind":"실험","text":"오늘 이 강의장의 전후 응답: 사전 1 이상 {pos}건 중 {pct}%가 1점 이상 내려감, 평균 {drop}점, 전후 짝 {pairs}건 — 교육 직후 익명 자기보고, 대조군 없음, 비맹검","source":"실시간 집계(익명)","confidence":"medium"},{"kind":"문헌","text":"공·롤러를 이용한 자가 근막 이완은 단기 관절가동범위 증가와 주관적 이완이 반복 보고되나 효과는 단기·개인차가 크고 구조를 바꾸는 근거는 아님","source":"일반 원칙(자가 근막 이완의 단기 효과)","confidence":"medium"}],"counter":"\"운동을 열심히 하는데 왜 아픈가?\" — 운동은 관리의 일부이지 전부가 아닙니다. 체육관 1시간이 아니라 체육관 밖 23시간이 몸의 상태에 더 오래 관여합니다. \"기대효과만으로도 점수는 내려가지 않나?\" — 맞습니다. 한쪽만 풀어도 기대는 남습니다. 그래서 변화의 원인을 특정하지 않고 '달라졌다고 볼 여지'까지만 말합니다. 변화가 없었던 분은 원인이 오늘 다룬 근육이 아닐 수 있습니다 — 그것도 중요한 정보입니다.","ruling":"주문: 오늘의 개입(아픈 곳이 아닌 굳은 곳을 풀고, 등·골반·발을 세운 것)은 이 강의장의 불편감을 달라지게 했다고 볼 여지가 있다. 조건: 관할 밖 징후는 의료기관이 먼저다. 한계: 교육 직후 익명 자기보고, 대조군 없음, 비맹검, 의학적 효과 아님.","action":"개인 판결 30초(필기 없이): 오늘 가장 많이 내려간 부위 하나, 그 범인 하나, 내일 1분 행동 하나를 마음에 정합니다. 휴대폰 메모도 좋습니다. 변화가 없었던 분은 '원인 미확정'으로 두고 재심(재측정) 날짜만 정합니다.","notes":"[0:00–0:20] 공개 전 고지: \"판결 선고 전에 한 가지. 좋아진 분만 손 드는 자리가 아닙니다. 그대로인 분, 더 불편한 분도 오늘 증거의 일부입니다.\" 20초 침묵 후 '판결 선고' 버튼. [0:20–1:10] 보드 읽는 순서 고정: ① 참여자 수 \"이 법정의 진술 건수\" ② 변화 없음·증가 비율을 먼저 \"이분들이 있어서 이 숫자가 믿을 만합니다. 전부 좋아졌다면 제가 먼저 의심합니다\" ③ 분모를 소리 내어: \"사전 0점은 내려갈 수 없으니 판정에서 제외했습니다. 사전 1점 이상 응답 중 1점 이상 내려간 비율입니다. 1점은 오차일 수 있어 2점 이상도 따로 보여드립니다\" ④ 평균 감소 \"5분 개입치고 크게 들리십니까, 작게 들리십니까 — 판단해 보실 만합니다\" ⑤ 부위별 표에서 최대·최소 감소를 나란히 \"용의자 가설이 가장 잘 맞은 부위와 덜 맞은 부위\". N<5 부위는 '참고용'이라고 말한다. 단위는 '건'으로 통일. [1:10–1:40] 주문·이유·조건·한계 낭독. 한계는 반드시 소리 내어 — '비맹검', '1회차와 조건 다름' 포함. [1:40–2:20] 쟁점 6 답: \"헬스장 다니시는 분? 그런데도 목이 아프시죠. 운동은 체육관 1시간, 관리는 체육관 밖 23시간입니다. 오늘 체육관식 운동 0분에 이 숫자입니다. 운동하지 말라는 뜻이 아닙니다.\" 무릎 소결의 '순서(풀기→방향→강화)'는 쟁점 6의 부속 단서라고만 말한다. 1회차 문장 재활용: \"풀어서 가벼워진 팔, 주차장에 두시면 다시 굳습니다.\" [2:20–2:30] 벌금 결산: \"오늘 벌금 총액은 전액 공으로 대납 처리됐습니다. 싸게 먹혔죠.\" \"오늘 답이 안 된 쟁점이 있으면 나가시면서 담당자께 말씀해 주십시오. 다음 회차의 첫 쟁점이 됩니다.\" \"이 판결은 강의장 전체의 판결입니다. 여러분 각자의 판결문은 휴대폰에 있습니다.\" 강사 사례는 '표본 1명'이라고 스스로 말한다. '구조는 안 바뀌므로 변화분은 근육 몫'이라는 소거법은 쓰지 않는다. '운동 0분' 표현은 반드시 '체육관식 운동 0분'으로."},{"id":"close","type":"close","min":2,"title":"폐정 — 집행과 재심: 오늘 가져갈 세 가지","eyebrow":"폐정 · 집행 · 재심 · 쟁점 4·7","question_no":7,"lead":"쟁점 7의 답입니다. 판결은 집행돼야 효력이 있고, 재발하면 재심입니다. 효과는 돌아옵니다 — 그래서 한 시간에 한 번 1분입니다.","cards":[{"k":"하나 · 범인","t":"아픈 곳 말고 굳은 곳","d":"목→등, 허리→엉덩이, 어깨→승모근·겨드랑이, 무릎→발·앞허벅지. 피해자만 주무르면 돌아오기 쉽습니다."},{"k":"둘 · 내쉬기","t":"아프면 참지 말고 5초 내쉰다","d":"내쉬고 → 미간 풀고 → 심봤다. 내쉬면서 힘을 빼는 것이 오늘의 연습입니다. 벌금 1만 원."},{"k":"셋 · 1분 리셋","t":"한 시간에 한 번, 1분","d":"A 법대: 발 3점·체중 옮기기 → 등 세우고 내쉬기 ×3 → 미간 → 회전 확인. B 집무실: A + 모서리 누르며 만세 ×2."},{"k":"재심","t":"돌아오면 다시 잰다","d":"재발은 실패가 아니라 재심 사유. 아침·잠들기 전 0~10, 같은 동작. 저림·힘 빠짐이 늘면 의료기관."}],"ruling":"세 가지: 범인을 찾는다, 내쉰다, 한 시간에 한 번 1분 리셋. 나머지는 잊어도 된다.","action":"지금 전원 A(법대) 버전 60초 실연(강사 카운트) — 이것이 각자 판결의 첫 집행입니다. 끝나면 옆사람에게 한 문장: \"내 범인은 ○○이고, 내일 1분 행동은 ○○이다.\" 말한 것이 집행됩니다.","quote":"\"그 이상은 말하지 않겠습니다. 판단은 재판장 여러분의 몫입니다. 이상으로 사건번호 2026-몸-2, 통증 사건 심리를 폐정합니다.\"","safety":"사진은 동의하신 분만, 종료 후 자율 — '안 푼 팔 내리고 푼 팔만 만세'. 대외 사용은 기관 서면 승인 후, 얼굴이 식별되는 사진은 본인 동의 없이 사용하지 않습니다. 복습 자료는 기관 공식 경로로 전원 동일 제공(상품·앱 가입·상담 유도·이름 수집 없음), 개인 연락처는 받지 않습니다.","notes":"[0:00–0:20] 쟁점 7: 손가락 세 개 — \"범인, 내쉬기, 1분 리셋.\" 판사님들은 요약을 잘 하시니 세 단어면 됩니다. 집행 주기는 한 문장으로만: \"한 시간에 한 번 1분.\" [0:20–1:20] 쟁점 4 답을 몸으로 — A 법대 버전 전원 실연, 강사가 초를 센다(손·공 없음, 소리 없이): \"0~10초 발 3점, 뒷주머니 쪽으로 체중 한 번. 10~40초 등받이에 등 위쪽, 배 조이고, 소리 안 나게 5초 내쉬기 셋. 40~55초 미간 힘 빼기. 55~60초 고개 좌우 — 달라졌습니까? 이게 법대 위 1분입니다. 집무실에서는 여기에 모서리 누르며 만세 둘을 더합니다(B).\" 마지막 벌금 콜백: \"방금 고개 끄덕인 걸 아신 분? 그 '앎'이 오늘의 발견입니다.\" [1:20–1:50] 옆사람에게 한 문장 낭독(30초). \"말한 것만 집행됩니다.\" [1:50–2:00] 폐정 선언은 quote 한 버전만 + 공 톡. 벌금 결산·미답 쟁점 안내는 판결 슬라이드 끝에서 이미 처리. 사진 안내는 화면 safety로만, 발화 생략. 앱·베타·특허 언급 금지(무상 서비스는 개인에게 제안하지 않고 필요 시 기관 공식 절차로만). 반대쪽 숙제는 각 부위 사후 QR에서 이미 45초 처리했으므로 '오늘 밤 3분 더'로만. ■ 종료 후 개별 Q&A 고정 대본(반드시 준수, 담당자에게도 사전 공유): \"오늘은 개별 처치를 하지 않습니다. 진단명이 있으시면 담당 의료진과 상의하시고, 오늘 방법은 '추가'로만 쓰십시오. 저림·힘 빠짐이 있으면 오늘 압박은 하지 않는 것이 제 규칙입니다.\" 금지 항목: ① 진단명·영상 소견에 대한 설명 ② 특정 부위에 손 대기(즉석 압박) ③ '없어진다·10초면 된다·눌리고 있다'류 발언 ④ 개인 연락처·상담 유도. 사전 서면 확인 3항목: 촬영 여부·범위(뒷모습·실습 장면 위주), 강사 SNS·홈페이지·제안서 게시 가부, 기관명·로고 대외 사용 가부."}],"parts":[{"id":"foot","name":"발·발목","hypothesis":"가설: 발은 1층입니다. 아치가 굳어 감각이 둔해지면 위층(무릎·허리)이 영향을 받는다는 가설입니다. 아치를 5초 압박하고 발가락을 교대로 움직인 뒤, 같은 발이 더 가볍고 탄력 있게 느껴지는지 확인합니다.","statement":"사건 1 접수 — 발·발목. 지금 이 순간, 방금 한 확인 동작(가볍게 뛰기 또는 3걸음)에서 느낀 불편감을 0~10으로 진술합니다. 0도 진술입니다. 최근 발목을 삐었거나 발이 붓고 뜨거우면 동작만 하셔도 됩니다.","check":"자가 확인 동작(10초): 제자리에서 가볍게 3번 뛰거나 3걸음. 뛰기가 부담되면(무릎 통증·임신·균형 불안·구두·미끄러운 바닥) 의자를 잡고 한 발씩 체중 옮기기 3회로 대체 — 비교의 효력은 같습니다. 발바닥 느낌과 어느 발이 둔한지 기억합니다.","reset":["한쪽 발만: 의자에 앉아 뒤꿈치는 바닥, 발 아치 중앙에 공. 굴리지 않고 누른 채 소리 나게 5초 내쉬기 ×5 (옆사람 귀에 들리게)","누른 채 엄지↑네 발가락↓ ↔ 엄지↓네 발가락↑ 교대 ×10 — 아프면 '심봤다', 숨은 계속","일어서서 뒤꿈치 바깥 → 앞꿈치 순서로 3걸음, 5%만 발바닥에"],"compare":"대질: 안 푼 발 vs 푼 발로 같은 동작(가볍게 뛰기, 또는 의자 잡고 한 발씩 체중 옮기기). 어느 발이 가볍고 탄력이 있습니까? 안 푼 발이 원래 내 발 — 반대편이 대조군입니다. 차이가 없으면 그것도 증언입니다. 사후 QR에는 누를 때 아픔이 아니라 지금 동작의 불편감을 적습니다.","slogan":"발은 1층입니다. 1층이 흔들리면 위층이 영향을 받습니다.","keep":"걸을 때 뒤꿈치 바깥 → 앞꿈치. 95%는 딴생각, 5%만 발바닥에. 엘리베이터·신호등에서 발가락 살짝 들어 아치 만들기. 1분 리셋의 첫 10초: 앉은 채 발 3점 + 발가락 교대.","safety":"최근 발목을 삐었거나 발바닥이 붓고 뜨거우면 압박은 생략하고 걷기만 합니다. 발 감각이 둔하거나(당뇨 등) 발에 상처·궤양 이력이 있으면 공 압박은 생략하고 발가락 교대와 걷기만 — 발 관리는 담당 의료진 지시 우선. 발바닥에 진단받은 통증(족저근막염 등)이 있으면 뒤꿈치 쪽은 피하고 강도를 낮추거나 생략, 걷기와 발가락 교대만. 저림·찌릿함은 오늘 실습의 중단 신호입니다 — 이유는 판단하지 않습니다. 구두·힐·미끄러운 바닥·균형 불안이면 뛰지 않고 의자를 잡고 체중 옮기기 또는 뒤꿈치 들었다 내리기로 대체. 항응고제 복용·멍 잘 드는 분은 압박 생략, 동작만.","evidence":[{"kind":"문헌","text":"발바닥 감각 입력이 서기·걷기의 균형 조절에 기여한다는 운동학의 일반 원칙 — 구조(평발 여부)가 아니라 사용법을 다룬다","source":"일반 원칙(발바닥 감각과 자세 조절)","confidence":"medium"},{"kind":"현장","text":"1회차(8/31) 현장에서 한쪽 발만 푼 뒤 같은 비교를 했을 때 '가벼워졌다' 반응 — 강사 관찰·자기보고, 기록 없음(참고). 1회차는 매트·누운 자세, 오늘은 의자 버전 — 조건이 다르므로 오늘이 의자 버전의 첫 기록","source":"1회차 강사 관찰","confidence":"medium"},{"kind":"실험","text":"오늘 안 푼 발 vs 푼 발 비교 + 사전/사후 QR","source":"현장 자기 대조","confidence":"medium"}],"counter":"\"평발이라 어쩔 수 없다\" — 발 모양(구조)은 오늘 못 바꿉니다. 오늘 바꾸는 것은 발의 감각과 근육 상태이고, 구조가 같아도 느낌이 달라지는지를 봅니다. '90%가 평발' 식 집단 호명은 하지 않고, 족저근막염이 낫는다고 말하지 않습니다.","ruling":"사건 1 소결 — 발 불편감 평균 {drop}점, 사전 1 이상 응답 중 {pct}%가 1점 이상 내려감(자기보고, 2점 이상은 화면 별도). 각자 판결: 푼 발이 다른가, 같은가. 1분 리셋의 첫 10초는 발 3점 + 발가락 교대.","answers_here":[3],"notes":"[5분] 0:00 공 톡. \"증거조사 개시. 사건 1, 발. 주장: 발은 1층이라는 가설.\" 0:10 확인 동작: 기립, 대체 동작을 먼저 제시한다: \"구두·힐·무릎 아픈 분·임신 중·균형 불안하면 뛰지 마시고 의자 잡고 한 발씩 체중 옮기기 셋. 나머지는 가볍게 셋.\" \"어느 발이 둔합니까? 그 발부터 풉니다.\" 0:40 리셋 1 — 호흡 규칙 통합 설명은 여기서 1회만: \"공은 굴리는 게 아니라 누르는 겁니다. 누르는 것보다 중요한 게 5초 동안 내쉬는 것. 창문에 김 서리듯 소리 나게. 옆사람 귀에 안 들리면 벌금.\" 발 감각 둔한 분·발 상처 이력·항응고제는 압박 생략 선언. 2:00 리셋 2 발가락 교대. \"아프죠? 심봤다.\" 2:50 리셋 3 걷기 3걸음. 3:30 대질(클라이맥스): \"공 빼고. 안 푼 발로 — 이게 원래 내 발. 푼 발로 — 다릅니까?\" 탄성이 나오면 멈추고 되묻기: \"지금 뭐라고 하셨습니까? 증인 진술로 채택하겠습니다.\" 1회차 현장 반응(매트 버전, 강사 메모)은 화면에 띄우지 않고 참고만. 4:20 집행 한 문장 + 1분 리셋 첫 10초 예고. 4:40 \"재검사 들어갑니다. 같은 동작, 같은 기준. 누를 때 아픔이 아니라 동작할 때 불편감입니다.\" [사후 QR 화면] 입력 20초 → 입력 끝난 분부터 반대쪽 45초 속성(공 아치 5초 ×3 + 발가락 교대 ×5) → 보드 읽고 ruling 문장 그대로, 좋든 나쁘든. 금지: '족저근막염이 바로 없어진다' → '몇 점 달라지는지 보겠습니다'."},{"id":"neck","name":"목","hypothesis":"가설: 목은 피해자, 유력한 용의자는 등(상부 흉추)입니다. 등이 굽으면 머리 위치가 바뀌어 목 근육이 더 오래 일한다는 가설입니다. 오늘 목은 한 번도 만지지 않고 등만 세운 뒤 회전 느낌이 달라지는지 확인합니다 — 쟁점 1·4·5를 여기서 답합니다.","statement":"사건 2 접수 — 목. 지금 이 순간, 방금 한 확인 동작(좌우 회전)에서 느낀 불편감을 0~10으로 진술합니다. 돌릴 때 걸리는 느낌도 점수에 넣습니다. 팔 저림·손 힘 빠짐이 있는 분은 압박은 생략하고 등 세우기만 하셔도 됩니다.","check":"쟁점 5 자가 확인 동작(10초): 정면에서 좌우로 편안한 범위까지 같은 속도로 회전. 더 걸리는 쪽을 기억합니다. 오늘의 기준선일 뿐입니다.","reset":["용의자 소환 — 의자 등받이에 등 위쪽을 붙이고 배를 살짝 조여 등 세우기, 소리 나게 5초 내쉬기 ×3. 목은 건드리지 않습니다. 이것이 1분 리셋의 핵심 30초입니다(쟁점 4)","공범 — 뒤통수 아래 움푹한 곳(양쪽)에 엄지, 아주 천천히 좌우 비교, 5초 내쉬기 ×3. 어지럼·시야 흐림·구역감이 오면 즉시 손 떼기","습관 인지 — 경청 중 내 목이 지금 무엇을 하는지 알아차리기. 끄덕임이 해롭다는 근거는 없습니다. 벌금은 '내 몸을 인지하는가'를 묻는 게임이지 끄덕이지 말라는 처방이 아닙니다. 70:30은 상대와 내 몸에 주의를 나누는 비율"],"compare":"대질: 같은 속도로 다시 회전. 각도보다 '덜 걸리는 느낌'을 확인합니다. 목을 건드리지 않았는데 회전 느낌이 달라졌다면, 적어도 '자세가 목 감각에 영향을 준다'는 것은 각자 확인한 셈입니다. 범인 확정은 아닙니다 — 가설 지지까지만. 이제 등을 범인이라 불러도 되겠습니까 — 판단은 재판장님이.","slogan":"목은 피해자, 용의자는 등입니다. 피해자만 주무르지 마세요.","keep":"화면 위쪽을 눈높이 근처로. 한 시간에 한 번 1분 리셋 — 그 핵심 30초가 등받이에 등 상부 붙이고 배 조여 내쉬기 ×3. 법대 위에서는 소리 없이, 티 나지 않게.","safety":"팔 저림·손 힘 빠짐·어지럼이 있으면 압박은 생략하고 등 세우기만. 목을 뒤로 꺾지 않습니다. 뒤통수 아래는 천천히·가볍게, 빠르게 문지르지 않고, 어지럼·시야 흐림·구역감이 오면 즉시 중단합니다. 저림·찌릿함은 오늘 실습의 중단 신호입니다 — 이유는 판단하지 않습니다. 항응고제 복용·멍 잘 드는 분은 압박 생략, 동작만. 목 진료 중인 분은 담당 의료진 지시를 우선합니다.","evidence":[{"kind":"문헌","text":"장시간 고정 사무작업의 한 유형(하루 4시간 이상 집중적 키보드·마우스 조작)을 국가 기준이 부담작업으로 지정 — 기록 검토는 직접 대상 아님, 취지만 원용","source":"고용노동부 근골격계부담작업 고시","confidence":"high"},{"kind":"현장","text":"1회차(8/31) 현장에서 경청 중 고개 끄덕임을 본인이 인지하지 못한 참가자 다수 — 강사 관찰, 기록 없음(참고). 1회차는 매트 버전, 오늘은 의자 버전 — 오늘이 의자 버전의 첫 기록","source":"1회차 강사 관찰","confidence":"medium"},{"kind":"실험","text":"오늘 목을 만지지 않고 등만 세운 뒤 회전 재확인 + 사전/사후 QR","source":"현장 자기 대조","confidence":"medium"}],"counter":"\"고개를 끄덕이면 디스크가 생기나?\" — 그렇게 말하지 않습니다. 끄덕임이 해롭다는 근거는 없고, 끄덕임은 오히려 소진폭 움직임입니다. 오늘 묻는 것은 '방금 내 목이 무엇을 했는지 알았는가'뿐입니다. \"머리가 앞으로 나가서 아프다\"는 문헌에서 일관되지 않으므로 가설로만 둡니다.","ruling":"사건 2 소결 — 목 불편감 평균 {drop}점, 사전 1 이상 응답 중 {pct}%가 1점 이상 내려감(자기보고). 목을 만지지 않고 얻은 숫자입니다. 쟁점 1 답: 목을 만지지 않고 자세 유지 근육(등)만 바꿨는데 달라졌다 — 범인은 나쁜 자세가 아니라 한 자세, 근육이 교대 근무를 못 한 것. 쟁점 4 답: 1분 리셋의 핵심 30초 = 등받이에 등 상부 붙이고 배 조여 내쉬기 ×3.","answers_here":[1,3,4,5],"notes":"[5분] 0:00 공 톡. \"사건 2, 목. 주장: 목은 피해자, 유력한 용의자는 등.\" 0:10 확인 동작(쟁점 5 답): \"좌우 회전 10초. 걸리는 쪽 기억. 이게 목 자가 확인의 전부입니다.\" 0:30 리셋 1(쟁점 4 답, 번호 붙여): \"쟁점 4 — 법대 위 1분의 핵심 30초입니다. 등받이에 등 위쪽, 배 조이고, 소리 없이 내쉬기 셋.\" 1:30 리셋 2 후두하 엄지, 좌우 비교. \"아주 천천히. 빨리 움직이면 힘이 안 빠집니다(현장 관찰).\" 어지럼·시야 흐림 즉시 중단. 해부학적 이유는 말하지 않는다. 2:40 리셋 3 끄덕임 습관 — 법원 맞춤 최고 구간. \"왜 끄덕이시냐면 저에게 집중하시니까요. 경청하는 직업병입니다.\" 벌금 게임: \"끄덕이면 1만 원 — 아, 또 끄덕이셨습니다, 2만 원.\" 웃음 뒤 반드시 착지: \"끄덕임을 없애라는 게 아닙니다. 방금 내가 끄덕인 걸 몰랐다는 것 — 그 '모름'이 오늘의 발견입니다. 관계도 중요하니 70:30.\" 3:30 대질: \"같은 속도로 회전. 목 한 번도 안 만졌습니다. 달라졌습니까? 이제 등을 범인이라 불러도 되겠습니까 — 판단은 재판장님이.\" 4:20 소결 예고. 4:40 재검사: \"같은 동작 직후, 같은 기준.\" [사후 QR 화면] 입력 → 반대쪽 후두하 30초 속성 → ruling 문장에 쟁점 1·4 번호 붙여 회수. 저림 호소자는 즉석 처치 금지 → \"지속되면 의료기관 평가\". 1회차 협착 진단 참가자가 다시 오더라도 개별 지목 금지. 1회차 현장 반응(강사 메모)은 화면에 띄우지 않는다."},{"id":"shoulder","name":"어깨","hypothesis":"가설: '통증은 근육의 집 주소'는 비유입니다 — 아픈 자리가 항상 원인 자리는 아닙니다. 어깨 무거움의 용의자는 목-어깨 모서리(승모근 상부)와 겨드랑이 뒤쪽 근육 벽(광배근)이라는 가설을 확인합니다. 한쪽만 풀면 팔 무게가 좌우로 달라지는지 봅니다 — 쟁점 5의 어깨 자가 확인이 여기 있습니다.","statement":"사건 3 접수 — 어깨. 지금 이 순간, 방금 한 확인 동작(양팔 만세)에서 느낀 불편감을 0~10으로 진술합니다. 뭉침·무거움·걸림 포함. 급성 통증·탈구 이력이 있는 분은 만세 대신 앞으로 들기까지만 합니다.","check":"쟁점 5 자가 확인 동작(10초): 양팔 천천히 만세. 걸리는 높이와 어느 팔이 무거운지 기억합니다. 무거운 팔이 오늘의 사건입니다.","reset":["한쪽만: 목과 어깨의 모서리(승모근 위, 살짝 뒤)를 등받이와 등 사이 공으로 받치고(골다공증 진단자는 손으로 가볍게), 내쉬며 팔 만세 ×3. 아픈 지점을 찾으면 '심봤다'","겨드랑이 정중앙은 누르지 않고 뒤쪽 근육 벽(정중앙에서 등 쪽으로 손가락 한 마디)에만 공을 손으로 대고 5초 내쉬기 ×3. 저림·찌릿함은 중단 신호 — 옮겨도 남으면 생략","미간의 힘 빼기 — 인상 쓰면 근육도 같이 조입니다. '지금 몇 % 뺐습니까? 80%? 5% 빼셨습니다.' 물 먹은 솜, 녹은 아이스크림까지"],"compare":"대질(클라이맥스): 안 푼 팔 만세 vs 푼 팔 만세. 팔 무게가 다릅니까? 한쪽만 풀어도 기대는 남습니다 — 어느 쪽을 풀었는지 본인이 아니까요. 다만 '전체가 좋아진 기분'과 '푼 쪽만 다른 감각'은 구분해 보실 수 있습니다. 사후 QR에는 누를 때 아픔이 아니라 만세할 때 불편감을 적습니다.","slogan":"'통증은 근육의 집 주소' — 비유입니다. 주소를 찾으면 '심봤다'.","keep":"팔이 가벼우면 스포츠카를 얻은 것 — 주차장에 두지 말고 쓰세요. 한 시간에 한 번 1분 리셋의 B(집무실) 버전: 모서리를 손으로 누른 채 만세 ×2 + 미간.","safety":"어깨 급성 통증·탈구 이력이 있으면 만세 대신 앞으로 들기까지만. 겨드랑이 정중앙은 누르지 않고 뒤쪽 근육 벽만. 저림·찌릿함·어지럼은 오늘 실습의 중단 신호입니다 — 이유는 판단하지 않습니다. 손가락 한 마디 옮겨도 남으면 그 부위는 생략. 골다공증 진단·스테로이드 장기 복용자는 등·갈비 쪽 압박을 손으로 가볍게, 체중을 싣지 않습니다. 항응고제 복용·멍 잘 드는 분은 압박 생략, 동작만. 강도는 '시원한 불편감', 숨이 쉬어지는 아픔까지 — 숨이 막히면 너무 센 것.","evidence":[{"kind":"문헌","text":"통증은 조직 손상의 크기와 동일하지 않으며 생물·심리·사회 요인의 영향을 받는다 — 아픈 자리가 원인 자리와 다를 수 있다","source":"IASP 통증 정의 개정 (2020)","confidence":"high"},{"kind":"현장","text":"1회차(8/31) 현장에서 안 푼 팔 vs 푼 팔 만세 비교 시 좌우 차이 반응 — 강사 관찰·자기보고, 기록 없음(참고). 1회차는 매트·누운 자세, 오늘은 의자 버전 — 오늘이 의자 버전의 첫 기록","source":"1회차 강사 관찰","confidence":"medium"},{"kind":"실험","text":"오늘 안 푼 팔 vs 푼 팔 만세 + 사전/사후 QR","source":"현장 자기 대조","confidence":"medium"}],"counter":"\"오십견·손목터널이 이걸로 낫나?\" — 낫는다고 말하지 않습니다. 그 진단명들은 의료기관의 영역입니다. 오늘은 그 위에 얹힌 굳은 근육을 풀면 '가벼워지는지'만 확인합니다. \"세게 누를수록 잘 풀린다\" — 더 세게가 더 낫다는 근거는 없고, 오늘 규칙은 숨이 쉬어지는 강도입니다.","ruling":"사건 3 소결 — 어깨 불편감 평균 {drop}점, 사전 1 이상 응답 중 {pct}%가 1점 이상 내려감(자기보고). 쟁점 5 답: 만세 한 번이면 어느 팔이 무거운지 안다 — 오늘의 기준선 관찰이다. 집 주소를 찾은 분과 못 찾은 분, 둘 다 증거입니다.","answers_here":[3,5],"notes":"[5분] 0:00 공 톡. \"사건 3, 어깨. 주장: 통증은 근육의 집 주소 — 비유입니다. 아픈 자리가 항상 원인 자리는 아닙니다.\" 0:10 확인 동작(쟁점 5): 양팔 만세, 무거운 팔 기억. 0:30 리셋 1 승모근 모서리, 한쪽만. \"오른손잡이는 보통 오른쪽. 아프면?\" → \"심봤다.\" 골다공증 진단자는 등받이 공 대신 손으로 가볍게, 항응고제는 압박 생략 선언. 1:40 리셋 2 겨드랑이 뒤 근육 벽 — 안전 문구 먼저, 이유 설명 없이: \"정중앙은 누르지 않습니다. 등 쪽으로 손가락 한 마디. 저리면 중단 신호, 옮겨도 남으면 생략.\" 2:40 리셋 3 메타인지 실험: \"지금 힘 몇 % 뺐습니까? 80%? — 5% 빼셨습니다. 물 먹은 솜, 녹은 아이스크림.\" 보톡스·외모 농담 없음. 3:20 대질(오늘 최고 클라이맥스): \"공 빼고. 안 푼 팔 만세. 푼 팔 만세.\" 탄성이 나오면 멈추고 되묻기: \"지금 뭐라고 하셨어요? 증인 진술로 채택하겠습니다.\" \"아프면 유죄, 안 아프면 무죄가 아닙니다. 감각은 선악이 없어요.\" 기대효과 한 문장: \"한쪽만 풀어도 기대는 남습니다. 전체 기분과 푼 쪽 감각만 구분해 보십시오.\" 4:20 집행: \"스포츠카, 주차장에 두지 마십시오.\" + 1분 리셋 B 버전. 4:40 재검사: \"만세 직후 불편감입니다. 누를 때 아픔이 아닙니다.\" [사후 QR 화면] 입력 → 반대쪽 모서리 45초 속성 → ruling. 1회차 현장 반응(참가자 발언 인용 없이 강사 메모)은 화면에 띄우지 않는다. 금지: '바로 낫게 해드린다' → '가벼워지는지 확인'."},{"id":"back","name":"허리","hypothesis":"가설: 허리는 피해자, 유력한 용의자는 엉덩이입니다. 오래 앉으면 엉덩이가 방석 역할만 하며 굳고 허리가 대신 일한다는 가설입니다. 같은 의자에서 한쪽 엉덩이만 풀고 골반 중간점을 찾은 뒤 다리 들기와 3걸음이 달라지는지 확인합니다 — 쟁점 2·4·5를 여기서 답합니다.","statement":"사건 4 접수 — 허리. 지금 이 순간, 방금 한 확인 동작(앉아서 숙이기 또는 3걸음)에서 느낀 불편감을 0~10으로 진술합니다. 다리로 뻗치는 통증·저림이 있는 분은 공은 생략하고 골반 흔들기만 하셔도 됩니다.","check":"쟁점 5 자가 확인 동작(10초): 앉은 채 몸통을 조금 숙여 허리 느낌, 또는 일어나 3걸음. 뻣뻣함의 위치와 첫 걸음의 느낌을 기억합니다.","reset":["한쪽만: 바퀴 의자는 벽·책상에 붙이고 양발을 바닥에 둔 채, 의자 위 청바지 뒷주머니 위치에 공, 그쪽 무릎을 바깥으로 벌리며 체중 싣기. '10초 불편할지, 오후 내내 불편할지' 선택","힘을 완전히 빼고 소리 나게 10초 내쉬기 ×2, 공을 바깥 위로 손가락 한 마디 옮겨 반복 — 더 아프면 '심봤다'. 저림·찌릿함은 중단 신호, 옮겨도 남으면 생략","골반을 앞뒤로 작게 5번 움직여 가장 편한 중간점에서 호흡 3회 — 이것이 좋은 의자가 못 해주는 일이고, 1분 리셋의 첫 10초(쟁점 4)"],"compare":"대질: 공 빼고 안 푼 다리 vs 푼 다리 들어 올리기. 일어나서 3걸음 — 첫 걸음이 다릅니까? 의자는 그대로였습니다(쟁점 2). 사후 QR에는 누를 때 아픔이 아니라 지금 동작의 불편감을 적습니다. 쟁점 5 답: 돌리고(목)·들고(어깨)·걷고(허리) — 10초씩, 0~10으로 적는다. 셋 중 가장 걸리는 동작이 오늘 내 사건.","slogan":"엉덩이는 방석이 아닙니다. 허리는 피해자, 용의자는 엉덩이.","keep":"앉을 때 골반 중간점에서 배를 살짝 조여 등을 세웁니다. 한 시간에 한 번 1분 리셋 — 가장 좋은 자세는 다음 자세. 1분 리셋의 첫 10초: 뒷주머니 쪽으로 체중 옮기기 + 골반 중간점.","safety":"바퀴 의자는 벽이나 책상에 붙이고, 양발을 바닥에 둔 채 체중을 옮깁니다. 의자가 밀리면 공을 뺍니다. 다리로 뻗치는 통증·저림이 있으면 공은 생략하고 골반 흔들기만 합니다. 저림·찌릿함은 오늘 실습의 중단 신호입니다 — 이유는 판단하지 않습니다. 손가락 한 마디 옮겨도 남으면 그 부위는 생략. 고관절·무릎 인공관절, 항응고제 복용·멍 잘 드는 분은 압박 생략, 동작만. 대소변 조절 이상·발열·야간통·최근 외상은 이 법정 관할 밖 — 의료기관 평가가 먼저입니다. 허리 진료 중인 분은 담당 의료진 지시 우선.","evidence":[{"kind":"문헌","text":"비특이적 요통에 일상 활동 지속·자기관리·운동을 권고. 레드플래그 징후는 별도 평가","source":"NICE NG59 (2016)","confidence":"high"},{"kind":"현장","text":"1회차(8/31) 현장에서 한쪽 엉덩이만 푼 뒤 다리 들기·걷기 비교 시 차이 반응, 강사 스스로 '다시 돌아온다' 고지 — 강사 관찰, 기록 없음(참고). 1회차는 매트·누운 자세, 오늘은 의자 버전 — 오늘이 의자 버전의 첫 기록","source":"1회차 강사 관찰","confidence":"medium"},{"kind":"실험","text":"오늘 같은 의자에서 한쪽만 풀고 다리 들기·3걸음 비교 + 사전/사후 QR","source":"현장 자기 대조","confidence":"medium"}],"counter":"\"디스크가 있으면 소용없지 않나?\" — 영상 소견은 오늘 못 바꿉니다. 오늘 확인하는 것은 그 위에 얹힌 근육 상태입니다. \"허리가 아프면 허리를 풀어야 한다\" — 오늘은 허리를 만지지 않았습니다. 변화가 없는 분은 원인이 엉덩이가 아닌 경우이니 손 들어 주세요 — 그것이 더 중요한 정보입니다. 저림이 늘면 의료기관입니다.","ruling":"사건 4 소결 — 허리 불편감 평균 {drop}점, 사전 1 이상 응답 중 {pct}%가 1점 이상 내려감(자기보고). 쟁점 2 답: 의자는 같았고 엉덩이만 달랐다 — 좋은 의자는 좋은 변호사, 대신 걸어 주진 않는다. 쟁점 4 답: 1분 리셋의 첫 10초 = 뒷주머니 쪽 체중 옮기기 + 골반 중간점. 쟁점 5 답: 돌리고·들고·걷고 — 10초씩, 0~10으로 적는다. 가장 걸리는 동작이 오늘 내 사건.","answers_here":[2,3,4,5],"notes":"[5분] 0:00 공 톡. \"사건 4, 허리. 주장: 허리는 피해자, 유력한 용의자는 엉덩이.\" 0:10 확인 동작(쟁점 5): 앉아서 숙이기 또는 3걸음. 쟁점 5 종합 구호는 여기서 한 번: \"돌리고, 들고, 걷고 — 10초씩, 0~10. 셋 중 가장 걸리는 게 오늘 내 사건입니다.\" 0:30 리셋 1 — 안전 문구 먼저, 이유 없이: \"바퀴 의자는 벽에 붙이고 양발 바닥. 저리면 손가락 한 마디 옮기고, 남으면 생략.\" 인공관절·항응고제는 압박 생략 선언. \"오늘 하루 종일 엉덩이가 방석이었습니다. 내 엉덩이가 외칩니다 — 전 방석이 아니에요.\" 1:20 \"10초 불편할지, 오후 내내 뻐근할지 선택하세요. 하나 둘 셋에 완전히 뺍니다.\" 한 마디 이동 후 반복. 2:40 리셋 3 골반 중간점(쟁점 2·4 답): \"앞뒤로 작게 5번, 가장 편한 중간. 이게 좋은 의자가 못 해주는 일입니다. 1분 리셋의 첫 10초가 이것.\" 3:20 대질: \"공 빼고. 안 푼 다리 들기. 푼 다리. 일어나서 3걸음. 첫 걸음이 다릅니까?\" 변화 없는 분 손들기 — 반드시 말한다: \"원인이 엉덩이가 아닌 경우이니 더 중요한 정보입니다.\" 법원 청중은 예외를 인정하는 쪽을 신뢰. 4:20 집행 + 1분 리셋 첫 10초. 4:40 재검사: \"같은 동작 직후, 누를 때 아픔 아님.\" [사후 QR 화면] 입력 → 반대쪽 뒷주머니 45초 속성 → ruling에 쟁점 2·4·5 번호 붙여 회수. 1회차 현장 반응(강사 메모)은 화면에 띄우지 않는다. 금지: '허리 한 방', '거의 마법', '즉시 없어진다' → '달라지는지 확인합니다'."},{"id":"knee","name":"무릎","hypothesis":"가설: 무릎은 2층입니다. 1층(발)과 3층(엉덩이·골반), 그리고 굳은 앞 허벅지가 무릎의 방향과 부담에 영향을 준다(개인차 큼)는 가설입니다. 앞 허벅지를 동적 이완하고 발 3점·무릎 방향을 맞춘 뒤 일어서기가 달라지는지 확인합니다 — 쟁점 6의 단서가 여기 있습니다.","statement":"사건 5 접수 — 무릎. 지금 이 순간, 방금 한 확인 동작(천천히 일어나기)에서 느낀 불편감을 0~10으로 진술합니다. 수술 직후·부종·열감이 있는 분은 압박은 생략하고 일어나기만 하셔도 됩니다.","check":"자가 확인 동작(10초): 의자에서 천천히 일어나기 1회. 무릎이 향하는 방향(둘째 발가락 쪽인지 안쪽인지)과 불편한 지점을 기억합니다.","reset":["한쪽만: 앉아서 허벅지 앞 중앙을 공이나 손바닥으로 누른 채 무릎 구부렸다 폈다 ×10, 움직이며 내쉬기(동적 이완). 아프면 '심봤다', 숨은 계속","발 3점(뒤꿈치·엄지 아래·새끼 아래)을 바닥에, 무릎은 둘째 발가락 방향 — 1층을 먼저 세운다","무릎을 잠그지 말고 2%만 구부린 채 엉덩이를 접어 일어나기 ×3 — 5%도 아니고 2%. 3층(엉덩이)이 일하게"],"compare":"대질: 안 푼 다리 vs 푼 다리 들기. 같은 속도로 한 번 더 일어나 비교합니다. 무릎은 만지지 않고 발과 방향만 바꿨는데 다르다면, '무릎은 2층' 가설이 지지된 것입니다 — 확정은 아닙니다. 사후 QR에는 일어날 때 불편감을 적습니다.","slogan":"무릎은 2층입니다. 1층(발)과 3층(엉덩이)이 무릎에 영향을 줍니다.","keep":"서 있을 때 무릎 2% 구부리기 — 엘리베이터와 신호등에서 연습. 계단은 발 3점을 딛고 무릎을 둘째 발가락 방향으로. 한 시간에 한 번 1분 리셋 첫 10초의 발 3점이 여기서 온다.","safety":"수술 직후·부종·열감·최근 외상·고관절·무릎 인공관절·항응고제 복용·멍이 잘 드는 분은 압박은 생략하고 발 3점·2% 일어나기만 합니다. 슬개골(무릎뼈)은 누르지 않습니다. 저림·찌릿함은 오늘 실습의 중단 신호 — 이유는 판단하지 않습니다. 병원 재활 중이면 그 프로그램을 그대로 하고 이완만 추가합니다 — 재활 중단을 권하지 않습니다.","evidence":[{"kind":"문헌","text":"성인에게 근력 강화 활동을 주 2일 이상 권고 — 강화는 필요하며, 오늘은 그 전 단계인 '풀기와 방향'을 다룬다","source":"WHO 신체활동 및 좌식행동 가이드라인 (2020)","confidence":"high"},{"kind":"현장","text":"감정인 본인 사례: 연골 이식 수술과 병원 재활을 마친 뒤에도 남아 있던 불편이, 이완을 먼저 하고 순서를 바꾼 뒤 달라져 42km 완주 — 표본 1명, 증거능력 낮음, 참고용","source":"강사 개인 경험","confidence":"medium"},{"kind":"실험","text":"오늘 안 푼 다리 vs 푼 다리 들기, 일어서기 비교 + 사전/사후 QR","source":"현장 자기 대조","confidence":"medium"}],"counter":"\"허벅지 근육을 키우면 무릎이 보호되지 않나?\" — 근력 강화는 무릎 재활의 표준이고 부정하지 않습니다. 감정인 의견은 '순서'입니다: 굳은 앞 허벅지를 먼저 풀고, 방향을 맞춘 뒤 강화. 수술·재활이 틀렸다는 뜻이 아니라 그 다음 단계 이야기이고, 표본 1명입니다. 그래서 오늘 여러분이 직접 잽니다.","ruling":"사건 5 소결 — 무릎 불편감 평균 {drop}점, 사전 1 이상 응답 중 {pct}%가 1점 이상 내려감(자기보고). 무릎 자체를 만지지 않고 1층·3층과 서는 방식만 바꿨습니다. 쟁점 6의 부속 단서: 근육을 '더 키우는 것'과 '풀고 제 방향으로 쓰는 것'은 다른 일이다 — 확정은 판결에서.","answers_here":[3,6],"notes":"[5분] 0:00 공 톡. \"마지막 사건, 무릎. 주장: 무릎은 2층이라는 가설.\" 0:10 확인 동작: 천천히 일어나기 1회, 무릎 방향 관찰. \"안쪽으로 모입니까?\" 0:30 리셋 1 허벅지 앞 압박 + 구부렸다 폈다 ×10. \"움직이면서 내쉽니다. 옆사람 귀에 안 들리면 호흡 안 한 것.\" 인공관절·항응고제·멍 잘 드는 분은 압박 생략, 동작만(rules와 동일). 1:30 감정인 서사 30초 — 문구 고정: \"수술과 병원 재활을 마친 뒤에도 남아 있던 불편이, 이완을 먼저 하고 순서를 이완→뒤쪽 강화→앞쪽 강화로 바꾼 뒤 달라져 지금 42km를 뜁니다. 수술·재활이 틀렸다는 뜻이 아니라 그 다음 단계 이야기이고, 표본 1명입니다. 병원 재활 중이면 그대로 하고 이완만 추가하십시오.\" 금지: '수술해도 안 낫는다', '슬개골이 더 당긴다'류 기전 단정. 2:20 리셋 2 발 3점·둘째 발가락 방향. 3:00 리셋 3 무릎 2% 일어나기 ×3(쟁점 6 단서): \"5% 아니고 2%. 티 나지 않게.\" 3:40 대질: 좌우 다리 들기, 한 번 더 일어나기. 4:20 집행 + 1분 리셋. 4:40 \"마지막 재검사. 일어날 때 불편감. 이제 판결로 갑니다.\" 벌금 결산 예고: \"오늘 벌금 총액은 판결 뒤 발표합니다.\" [사후 QR 화면] 입력 → 반대쪽 허벅지 45초 속성 → ruling → 바로 판결 슬라이드."}],"answers":[{"no":1,"question":"왜 일을 오래 하면 목과 허리가 아픈가?","conclusion":"범인은 '나쁜 자세'가 아니라 '한 자세'라는 가설입니다 — 오래 같은 자세로 있으면 목·허리를 받치는 근육이 쉬지 못하고 계속 일하는 정적 부하가 쌓이며, 많은 경우 조직 손상보다 정적 부하로 설명됩니다(NICE NG59: 요통 대부분은 비특이적, 목은 유추). 개별 원인은 의료기관 판단입니다.","grounds":["고용노동부 근골격계부담작업 고시: 하루 4시간 이상 집중적 키보드·마우스 조작 작업을 부담작업으로 지정해 사업주 유해요인조사 의무 부과 — 장시간 고정 사무작업의 한 유형을 국가 기준이 부담작업으로 지정(기록 검토는 직접 대상 아님, 취지만 원용) (high)","WHO 2020: 성인에게 좌식 시간을 줄이고 어떤 강도의 활동으로든 대체할 것을 권고 (high)","정적 부하 일반 원칙: 자세 유지 근육의 장시간 저강도 수축은 혈류 감소와 피로를 누적시킨다 — 구체 수치 없이 일반 원칙으로만 (medium)"],"today_check":"목 사건에서 목을 만지지 않고 등받이에 등 상부만 붙여 등을 세운 뒤 좌우 회전을 다시 합니다. 목을 건드리지 않았는데 회전 느낌이 달라지면, 적어도 '자세가 목 감각에 영향을 준다'는 것은 각자 확인한 셈입니다(범인 확정 아님, 가설 지지까지). 사후 QR 소결에서 쟁점 1 번호를 붙여 회수합니다.","route":"→ 쟁점 1 슬라이드 + 목 사건 소결","slide_ids":["q1","practice-neck","qr-neck-post"]},{"no":2,"question":"좋은 의자와 바른 자세만으로 해결되지 않는 이유는 무엇인가?","conclusion":"의자와 자세는 필요조건이지 충분조건이 아니다 — 가장 좋은 자세는 다음 자세다. (좋은 의자는 좋은 변호사: 부담을 나눠 주지만 대신 걸어 주진 않는다. 어떤 좋은 자세도 오래 고정되면 다시 정적 부하가 되고, 굳은 엉덩이·등으로는 바른 자세를 만들기 어렵다는 가설 — 답은 굳은 곳 풀기 + 자세 바꾸기.)","grounds":["NICE NG59(2016): 요통에 일상 활동 지속과 운동을 권고 — 정지가 아니라 움직임이 표준(요통 지침, 타 부위는 유추) (high)","WHO 2020: 좌식 시간 자체를 줄이라고 별도 권고 — '더 잘 앉기'가 아니라 '덜 오래 앉기' (high)","단일한 '이상적 자세'의 근거는 약하고 자세를 자주 바꾸는 것이 더 중요하다는 견해가 전문 문헌에서 제시됨 — 일반 원칙, 저자명은 references에만 (medium)"],"today_check":"쟁점 2 슬라이드에서 60초 동안 '가장 바른 자세'를 유지하고 어디가 먼저 뻐근한지 기억합니다(아무렇지 않아도 정상 — 고시 기준은 4시간). 허리 사건에서 같은 의자에 앉은 채 한쪽 엉덩이만 풉니다 — 의자는 그대로인데 다리 들기·3걸음이 좌우로 다르면 의자가 변수가 아니었다는 증거입니다.","route":"→ 쟁점 2 슬라이드(60초 실험) + 허리 사건 소결","slide_ids":["q2","practice-back","qr-back-post"]},{"no":3,"question":"통증이 있을 때 움직여도 되는 것과 병원에 가야 하는 것을 어떻게 구분하는가?","conclusion":"관할 밖 대표 일곱 가지(저림·힘 빠짐·대소변 장애·발열·야간통·외상·급성 심한 통증)는 가이드라인 공통 기준으로 오늘 압박을 생략하고 의료기관 평가가 먼저이며, '자세를 바꾸면 덜해지고, 눌렀을 때 시원한 불편감이며, 숨 쉬면서 견딜 수 있는' 뻐근함은 오늘 실습 참가를 위한 감정인의 실무 기준입니다 — 이 목록은 배제 도구가 아니며 병원 갈지의 최종 판단은 의료인의 몫입니다.","grounds":["NICE NG59(2016): 심각한 원인을 시사하는 징후(레드플래그)는 별도 평가, 그 외 대부분은 일상 활동 지속과 운동 권고 — 요통 지침이며 다른 부위는 같은 원칙을 유추 적용 (high, 유추 medium)","IASP 2020 주석: 통증과 통각은 다른 현상이며 통증은 감각 신경 활동만으로 추론할 수 없다 — 그래서 세기만으로 가르지 않고 동반 징후를 함께 본다(관할 기준 도출은 감정인의 적용) (high)","임상 가이드라인 공통 레드플래그 일반 원칙: 신경학적 결손, 대소변 이상, 감염·종양 의심, 외상, 원인 모를 체중 감소·암 병력·스테로이드 장기 복용은 평가 대상 (high)","레드플래그는 선별 도구이지 배제 도구가 아님 — 개별 항목의 민감도·특이도는 낮다는 일반 원칙. 2~4주 이상 지속·악화도 평가 대상 (medium)","관할 안 세 가지 기준과 '숨이 쉬어지는 강도'는 가이드라인이 아니라 감정인의 실무 기준 (medium)"],"today_check":"증거능력 고지 슬라이드의 일곱 가지를 각 부위 사전 QR 전 10초 자가 확인합니다. 하나라도 해당되면 그 부위는 동작만 — 손 들 필요 없이 본인만 알면 됩니다. 실습 중 '숨이 막히는가, 찌릿한가, 어지러운가' 셋 중 하나라도 있으면 그 자리는 패스(이유는 판단하지 않음). 목·어깨 통증에 가슴 답답함·식은땀이 함께 오면 실습이 아니라 응급. 부위별 안전 문구가 같은 기준을 반복합니다.","route":"→ 증거능력 고지(방금) + 심리 절차 + 부위별 안전 문구","slide_ids":["rules","bridge","practice-foot","practice-neck","practice-shoulder","practice-back","practice-knee"]},{"no":4,"question":"재판이나 기록 검토 중 1분밖에 없다면 무엇을 해야 하는가?","conclusion":"A 법대 위 버전(손·공 없음, 티 안 나게): 발 3점·뒷주머니 쪽 체중 옮기기(0~10초) → 등받이에 등 상부 붙이고 배 조여 소리 안 나게 5초 내쉬기 ×3(10~40초) → 미간 힘 빼기(40~55초) → 고개 좌우 회전 확인(55~60초). B 집무실·기록 검토 버전: A + 모서리 누르며 만세 ×2(공 있으면 공). 목·허리를 만지지 말고 용의자만 건드립니다.","grounds":["WHO 2020: 좌식 시간을 줄이고 어떤 강도의 활동으로든 대체할 것을 권고, '어떤 활동이든 안 하는 것보다 낫다' (high). '자주 끊기'는 감정인의 번역 (medium)","고용노동부 VDT 취급근로자 작업관리지침: 장시간 화면 작업 시 주기적 휴식과 자세 변화 권고 — 구체 시간은 인용하지 않음 (medium)","오늘 목·허리 사건이 이 1분 버전의 확장판 — 사전/사후 QR로 달라지는지 확인 (실험, medium)"],"today_check":"목 사건의 첫 리셋(등 세우기 ×3)이 1분 버전의 핵심 30초, 허리 사건의 골반 중간점이 첫 10초입니다 — 각 소결에서 '쟁점 4' 번호를 붙여 부위별 항목이 종합 절차의 부품임을 밝힙니다. 폐정에서 전원이 강사 카운트로 A(법대) 버전 60초를 실연합니다.","route":"→ 목·허리 사건의 '1분 리셋 부품' + 폐정 전원 실연","slide_ids":["practice-neck","practice-back","qr-neck-post","qr-back-post","close"]},{"no":5,"question":"어깨·목·허리 중 내 문제를 간단히 확인할 방법이 있는가?","conclusion":"돌리고(목)·들고(어깨)·걷고(허리) — 10초씩, 0~10으로 적는다. 셋 중 가장 걸리는 동작이 오늘 내 사건이고, 같은 동작에서 더 걸리거나 무거운 쪽이 먼저 풀 쪽입니다 — 오늘 쓴 자가 확인 동작 그대로이며, 진단이 아니라 오늘의 기준선 관찰입니다.","grounds":["0~10 숫자 척도(NRS)는 통증·불편감 자기보고의 표준 도구 — 같은 기준의 반복 측정이 변화를 보여준다 (high)","좌우 비교는 개인 내 자기 대조로, 시간·피로·기분처럼 양쪽에 걸리는 요인을 빼고 '전체 기분'과 '국소 감각'을 분리하는 보조 장치 — 기대는 제거하지 못함(비맹검) — 연구설계 일반 원칙 (medium)","1회차 현장: 안 푼 쪽 vs 푼 쪽 비교에서 좌우 차이 반응(자기보고, 미기록 다수, 매트 버전) (medium)"],"today_check":"목·어깨·허리 사건의 '자가 확인 동작' 첫 10초가 그것이고, 허리 소결에서 세 단어 구호로 종합합니다. 아침·잠들기 전 같은 세 동작을 같은 속도로 하고 숫자만 적으면 집에서도 재현됩니다. 저림·힘 빠짐이 동반되면 관찰이 아니라 의료기관 평가입니다.","route":"→ 목·어깨·허리 사건의 자가 확인 동작, 허리 소결에서 종합","slide_ids":["practice-neck","practice-shoulder","practice-back","qr-back-post"]},{"no":6,"question":"운동을 많이 하는 것과 몸을 잘 관리하는 것은 어떻게 다른가?","conclusion":"운동은 체육관 1시간의 '양', 관리는 체육관 밖 23시간의 '상태'이며 둘은 서로 대체되지 않습니다 — 관리 없는 운동은 주차장의 스포츠카입니다. (무릎 소결의 '풀기→방향→강화' 순서는 이 답의 부속 단서.)","grounds":["WHO 2020: 신체활동 권고(주 150~300분 중강도, 근력 주 2회)와 좌식 시간 감소 권고가 별개의 두 축 — 운동을 채워도 좌식은 따로 줄여야 함 (high)","자가 근막 이완의 단기 효과 일반 원칙: 단기 가동범위 증가·주관적 이완은 반복 보고되나 단기·개인차, 구조 변화 근거 아님 — 그래서 매일 반복하는 '관리'가 필요 (medium)","오늘 실험: 체육관식 운동 0분, 풀기·호흡·자세 변화·짧은 확인 동작만으로 숫자가 달라졌는지 — 피날레 집계, 자기보고·대조군 없음·비맹검 (medium)"],"today_check":"판결 슬라이드의 결과 공개 — 오늘 체육관식 운동(근력·유산소)은 하지 않았는데 전후 응답이 달라졌는지 봅니다. 변화 없음·증가 비율을 먼저 읽습니다. 무릎 사건의 '풀고 → 발·엉덩이 세우고 → 일어나기' 순서가 단서, 확정은 판결에서.","route":"→ 무릎 사건 소결 + 판결(주문 끝 문장)","slide_ids":["practice-knee","qr-knee-post","verdict"]},{"no":7,"question":"오늘 딱 세 가지만 기억한다면 무엇인가?","conclusion":"① 범인 — 아픈 곳 말고 굳은 곳(목→등, 허리→엉덩이, 어깨→승모근·겨드랑이, 무릎→발·앞허벅지) ② 내쉬기 — 아프면 참지 말고 5초 소리 나게(내쉬고·미간 풀고·심봤다) ③ 1분 리셋 — 한 시간에 한 번 1분, 5%만. 세 단어: 범인 · 내쉬기 · 1분 리셋.","grounds":["범인: 오늘 다섯 사건 모두 아픈 부위를 직접 만지지 않고 굳은 곳 function randId(n){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';const c=new Uint8Array(n);(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(c):c.forEach((_,i)=>c[i]=Math.floor(Math.random()*256));for(let i=0;i<n;i++)s+=a[c[i]%a.length];return s;}

function drawQR(canvas,text){
  const q=window.QRCodeGen(text,'M'),n=q.getModuleCount(),cell=8,quiet=4,size=(n+quiet*2)*cell;
  canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);ctx.fillStyle='#0B1730';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect((c+quiet)*cell,(r+quiet)*cell,cell,cell);
}

/* ---------- demo data (가상, 화면에 항상 표시) ---------- */
const demo=(function(){
  let seed=20260903;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  const rows=[];const N=38;
  const base={foot:4.2,neck:5.6,shoulder:5.9,back:5.1,knee:3.8};
  for(let i=0;i<N;i++){const token='demo'+i;PARTS.forEach(p=>{
    const pre=Math.max(0,Math.min(10,Math.round(base[p.id]+(rnd()-0.5)*5)));
    rows.push({token,part:p.id,phase:'pre',score:pre,extra:{}});
    if(rnd()<0.86){const drop=pre===0?0:Math.max(-1,Math.min(pre,Math.round(rnd()*4-0.9)));rows.push({token,part:p.id,phase:'post',score:Math.max(0,Math.min(10,pre-drop)),extra:{}});}
  });}
  return {rows:()=>rows.slice(),add:d=>rows.push(Object.assign({},d))};
})();

/* ---------- stats ---------- */
function computeStats(rows,manual){
  const latest={};rows.forEach(r=>{if(!PART_BY[r.part]||(r.phase!=='pre'&&r.phase!=='post'))return;const s=Number(r.score);if(!(s>=0&&s<=10))return;latest[r.token+'|'+r.part+'|'+r.phase]=s;});
  const tokens=new Set();Object.keys(latest).forEach(k=>tokens.add(k.split('|')[0]));
  const parts={};let allPairs=[],allPos=0;const personPairs={};
  PARTS.forEach(p=>{
    const pre=[],post=[],pairs=[];let posPairs=0;const dist=Array(11).fill(0);
    tokens.forEach(t=>{const a=latest[t+'|'+p.id+'|pre'],b=latest[t+'|'+p.id+'|post'];
      if(a!==undefined){pre.push(a);dist[a]++;}if(b!==undefined)post.push(b);
      if(a!==undefined&&b!==undefined){pairs.push(a-b);if(a>=1)posPairs++;(personPairs[t]=personPairs[t]||[]).push(a-b);}});
    let src='live';
    if(pairs.length===0&&manual&&manual[p.id]){const m=manual[p.id];src='manual';
      for(let i=0;i<(m.same||0);i++)pairs.push(0);for(let i=0;i<(m.d1||0);i++)pairs.push(1);for(let i=0;i<(m.d2||0);i++)pairs.push(2);for(let i=0;i<(m.d3||0);i++)pairs.push(3);for(let i=0;i<(m.worse||0);i++)pairs.push(-1);posPairs=pairs.length;}
    const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
    parts[p.id]={nPre:pre.length,nPost:post.length,meanPre:mean(pre),meanPost:mean(post),dist,nPairs:pairs.length,nPos:posPairs,meanDrop:mean(pairs),imp1:pairs.filter(d=>d>=1).length,imp2:pairs.filter(d=>d>=2).length,same:pairs.filter(d=>d===0).length,worse:pairs.filter(d=>d<0).length,src};
    allPairs=allPairs.concat(pairs);allPos+=posPairs;
  });
  const persons=Object.keys(personPairs);const personsImproved=persons.filter(t=>personPairs[t].some(d=>d>=1)).length;
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return {parts,participants:tokens.size,nPairs:allPairs.length,nPos:allPos,meanDrop:mean(allPairs),imp1:allPairs.filter(d=>d>=1).length,imp2:allPairs.filter(d=>d>=2).length,same:allPairs.filter(d=>d===0).length,worse:allPairs.filter(d=>d<0).length,persons:persons.length,personsImproved,dropDist:{0:allPairs.filter(d=>d<=0).length,1:allPairs.filter(d=>d===1).length,2:allPairs.filter(d=>d===2).length,3:allPairs.filter(d=>d>=3).length}};
}

   PRESENTER — 슬라이드 시퀀스: SPEC.slides(앞부분) → 부위 5개 × (진술 QR · 증거조사 · 재검사 QR) → SPEC.slides(뒷부분) → 참고문헌

function buildSlides(){
  const common=(SPEC.slides&&SPEC.slides.length)?SPEC.slides.slice():[{id:'open',type:'open',min:1,title:'오늘 재판장은 여러분입니다'}];
  let cut=common.findIndex(s=>['verdict','close'].includes(s.type)||s.after_parts===true);
  if(cut<0)cut=common.length;
  const pre=common.slice(0,cut),post=common.slice(cut);
  const seq=[];
  pre.forEach(s=>seq.push(Object.assign({min:1},s)));
  PARTS.forEach(p=>{seq.push({id:'qr-'+p.id+'-pre',type:'qr',part:p.id,phase:'pre',min:1.5});seq.push({id:'practice-'+p.id,type:'practice',part:p.id,min:5});seq.push({id:'qr-'+p.id+'-post',type:'qr',part:p.id,phase:'post',min:1.5});});
  post.forEach(s=>seq.push(Object.assign({min:1},s)));
  if(!seq.some(s=>s.type==='verdict'))seq.push({id:'verdict',type:'verdict',min:2,title:'판결'});
  if(SPEC.references&&SPEC.references.length)seq.push({id:'references',type:'references',min:0,title:'참고 근거'});
  let acc=0;seq.forEach(x=>{acc+=Number(x.min)||0;x.cum=acc;});
  return seq;
}

  const fn=R[sl.type]||R.generic;const body=fn(sl);
  const notes=sl.type==='practice'?PART_BY[sl.part].notes:(sl.type==='qr'?(sl.phase==='pre'?'[1.5분] "휴대폰을 들고 찍고, 숫자 하나 누르고, 내려놓기." 응답 수가 올라가는 것을 보여주며 기다린다. '+(PART_BY[sl.part].statement||''):'[1.5분] 같은 기준으로 재검사. 평균 감소 폭과 개선율을 증거처럼 읽어 준다. 변화 없는 분도 데이터라고 말한다.'):(sl.notes||''));
  app.innerHTML=`<div id="stage"><div class="chrome"><div><b>${esc(cfg.program)}</b> &nbsp;·&nbsp; ${esc(cfg.title||cfg.session)} &nbsp; ${chromeStatus()}</div><div class="clock" id="clock">${clockHtml()}</div></div><div class="slide ${(sl.type==='verdict'&&revealed)||['issue','references','issues','practice','rules','close'].includes(sl.type)?'top':''} ${sl.type==='practice'?'practice':''}">${body}</div><div class="footer"><div>${esc(cfg.brand)} · <span class="kbd">→</span> 다음 <span class="kbd">←</span> 이전 <span class="kbd">S</span> 설정 <span class="kbd">N</span> 노트 <span class="kbd">R</span> 리포트 <span class="kbd">M</span> 수기집계 <span class="kbd">F</span> 전체화면 <span class="kbd">T</span> 타이머</div><div class="nav"><button id="refreshBtn">새로고침</button><button id="prevBtn">◀ 이전</button><button id="nextBtn">다음 ▶</button></div></div></div>${notesOn?`<div class="notes"><h4>강사 노트</h4>${esc(notes||'(노트 없음)')}</div>`:''}`;
  if(sl.type==='qr'){try{drawQR($('#qr'),joinUrl(sl.part,sl.phase));}catch(e){}}
  autoFit();
  if(sl.type==='verdict'){const b=$('#revealBtn');if(b)b.addEventListener('click',()=>{revealed=true;render();});if(revealed)animateFinale();}
  $('#prevBtn').addEventListener('click',()=>go(idx-1));$('#nextBtn').addEventListener('click',()=>go(idx+1));$('#refreshBtn').addEventListener('click',()=>refresh(true));
  store('jr.idx.'+cfg.session,idx);
}
function autoFit(){const el=$('.slide');if(!el)return;el.style.zoom='';let z=1;for(let i=0;i<4;i++){const ratio=el.clientHeight/el.scrollHeight;if(ratio>=0.995)break;z=Math.max(0.5,z*ratio*0.97);el.style.zoom=z.toFixed(3);}}
window.addEventListener('resize',()=>autoFit());
function animateFinale(){
  document.querySelectorAll('[data-count]').forEach(el=>{const target=Number(el.dataset.count),dec=Number(el.dataset.dec||0),small=el.querySelector('small')?el.querySelector('small').outerHTML:'';const t0=performance.now(),dur=1400;
    (function step(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.innerHTML=(target*e).toFixed(dec)+small;if(k<1)requestAnimationFrame(step);})(t0);});
  requestAnimationFrame(()=>document.querySelectorAll('.fill[data-w]').forEach(el=>el.style.width=el.dataset.w+'%'));
}
function go(n){if(n<0||n>=SLIDES.length)return;idx=n;if(!startedAt&&idx>0){startedAt=Date.now();store('jr.start.'+cfg.session,startedAt);}render();schedulePoll();}
async function refresh(force){
  const sl=SLIDES[idx];if(!force&&sl.type!=='qr'&&sl.type!=='verdict')return;
  try{rows=await api.rows(cfg.session);fetchErr=null;lastFetch=new Date().toLocaleTimeString('ko-KR',{hour12:false});}
  catch(e){fetchErr=e.message;}
  stats=computeStats(rows,manual());
  if(sl.type==='qr'||(sl.type==='verdict'&&revealed===false)||force)render();
}
function schedulePoll(){clearInterval(pollTimer);const sl=SLIDES[idx];if(sl.type==='qr'||sl.type==='verdict'){refresh();pollTimer=setInterval(refresh,5000);}}
function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2200);}

/* overlays */
function closeOverlay(){const o=$('.overlay');if(o)o.remove();}
function openSettings(){
  closeOverlay();const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="panel"><h3>설정</h3>
  <label>세션 코드 (영문·숫자·하이픈, QR에 포함됨)</label><input type="text" id="f_session" value="${esc(cfg.session)}">
  <label>세션 표시명</label><input type="text" id="f_title" value="${esc(cfg.title)}">
  <label>백엔드 URL (Google Apps Script 웹 앱 /exec)</label><input type="url" id="f_backend" value="${esc(cfg.backend)}" placeholder="https://script.google.com/macros/s/.../exec">
  <label>참가자 페이지 주소 (비우면 현재 주소 사용: ${esc(location.origin+location.pathname)})</label><input type="url" id="f_join" value="${esc(cfg.joinBase)}" placeholder="https://drjinfit-ship-it.github.io/jinkim/web/">
  <label>복습 자료 URL (선택)</label><input type="url" id="f_review" value="${esc(cfg.reviewUrl)}">
  <label>퍼센트 표시 최소 N</label><input type="number" id="f_minN" value="${esc(cfg.minN)}" min="1" max="100">
  <label>브랜드 / 프로그램명 / 연락처</label><input type="text" id="f_brand" value="${esc(cfg.brand)}"><input type="text" id="f_program" value="${esc(cfg.program)}" style="margin-top:6px"><input type="text" id="f_contact" value="${esc(cfg.contact)}" style="margin-top:6px">
  <div class="row"><label style="margin:0;display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="f_demo" ${cfg.demo?'checked':''}> 데모 모드 (가상 데이터로 리허설)</label><label style="margin:0;display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="f_showContact" ${cfg.showContact?'checked':''}> 마지막 화면에 연락처 표시</label></div>
  <div class="hint">${location.protocol==='file:'?'<span class="err">지금은 파일로 열려 있어 QR이 참가자 휴대폰에서 열리지 않습니다. GitHub Pages 주소로 배포한 뒤 그 주소로 여세요.</span><br>':''}실제 수집을 하려면 README의 배포 절차대로 Apps Script를 배포하고 위 백엔드 URL을 넣은 뒤 "연결 테스트"를 누르세요. 데모 모드가 켜져 있으면 서버에 아무것도 보내지 않습니다.</div>
  <div class="row"><button id="f_save">저장</button><button class="ghost" id="f_test">연결 테스트</button><button class="ghost" id="f_reset">진행 초기화 (타이머·슬라이드)</button><button class="ghost" id="f_close">닫기</button><span id="f_msg"></span></div></div>`;
  document.body.appendChild(o);
  const read=()=>{cfg.session=$('#f_session').value.trim().replace(/[^A-Za-z0-9_\-.]/g,'-').slice(0,64)||'session';cfg.title=$('#f_title').value.trim();cfg.backend=$('#f_backend').value.trim();cfg.joinBase=$('#f_join').value.trim();cfg.reviewUrl=$('#f_review').value.trim();cfg.minN=Math.max(1,Number($('#f_minN').value)||5);cfg.brand=$('#f_brand').value.trim()||DEFAULTS.brand;cfg.program=$('#f_program').value.trim()||DEFAULTS.program;cfg.contact=$('#f_contact').value.trim();cfg.demo=$('#f_demo').checked;cfg.showContact=$('#f_showContact').checked;saveCfg();};
  $('#f_save').addEventListener('click',()=>{read();closeOverlay();revealed=false;startedAt=store('jr.start.'+cfg.session)||null;idx=Number(store('jr.idx.'+cfg.session))||0;render();schedulePoll();toast('저장됨');});
  $('#f_test').addEventListener('click',async()=>{read();const m=$('#f_msg');m.textContent='확인 중…';m.className='';try{const j=await api.ping();m.textContent=j.demo?'데모 모드 — 서버 사용 안 함':'연결 성공';m.className='ok';}catch(e){m.textContent='연결 실패: 배포 URL과 "모든 사용자" 액세스 설정을 확인하세요';m.className='err';}});
  $('#f_reset').addEventListener('click',()=>{if(!confirm('타이머와 슬라이드 위치를 처음으로 되돌립니다. 수집 데이터는 지워지지 않습니다.'))return;store('jr.start.'+cfg.session,null);startedAt=null;idx=0;revealed=false;closeOverlay();render();});
  $('#f_close').addEventListener('click',closeOverlay);
}
function openManual(){
  const sl=SLIDES[idx];const pid=sl.part||PARTS[0].id;const m=manual();const cur=m[pid]||{};
  closeOverlay();const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="panel"><h3>수기 집계 (오프라인 대안) · ${esc(PART_BY[pid].name)}</h3><div class="hint">QR이 안 될 때 손들기로 셉니다. "실습 후 몇 점 좋아졌습니까?" — 각 인원수를 입력하면 이 부위의 전후 짝 데이터로 사용됩니다(온라인 짝이 하나라도 있으면 온라인 데이터가 우선).</div>
  <div class="manual-grid" style="margin-top:14px"><div><label>변화 없음</label><input type="number" id="m_same" min="0" value="${cur.same||0}"></div><div><label>1점 감소</label><input type="number" id="m_d1" min="0" value="${cur.d1||0}"></div><div><label>2점 감소</label><input type="number" id="m_d2" min="0" value="${cur.d2||0}"></div><div><label>3점 이상 감소</label><input type="number" id="m_d3" min="0" value="${cur.d3||0}"></div><div><label>증가</label><input type="number" id="m_worse" min="0" value="${cur.worse||0}"></div></div>
  <div class="row"><button id="m_save">저장</button><button class="ghost" id="m_clear">이 부위 삭제</button><button class="ghost" id="m_close">닫기</button></div></div>`;
  document.body.appendChild(o);
  $('#m_save').addEventListener('click',()=>{m[pid]={same:+$('#m_same').value||0,d1:+$('#m_d1').value||0,d2:+$('#m_d2').value||0,d3:+$('#m_d3').value||0,worse:+$('#m_worse').value||0};store('jr.manual.'+cfg.session,m);closeOverlay();stats=computeStats(rows,manual());render();toast('수기 집계 저장');});
  $('#m_clear').addEventListener('click',()=>{delete m[pid];store('jr.manual.'+cfg.session,m);closeOverlay();stats=computeStats(rows,manual());render();});
  $('#m_close').addEventListener('click',closeOverlay);
}
function openReport(){
  const st=stats;const lines=[];
  lines.push(`# ${cfg.title||cfg.session} — 현장 익명 사전/사후 자기평가 집계 (${new Date().toLocaleString('ko-KR')})`);
  lines.push(`참여자(익명 기기) ${st.participants}명 · 전후 짝 있는 참여자 ${st.persons}명 · 전후 응답 쌍 ${st.nPairs}건`);
  lines.push(st.nPairs?`전체: 평균 ${fmt1(st.meanDrop)}점 감소(전후 짝 ${st.nPairs}건) · 사전 1점 이상 ${st.nPos}건 중 1점 이상 감소 ${pct(st.imp1,st.nPos)}% · 2점 이상 ${pct(st.imp2,st.nPos)}% · 전체 짝 중 변화 없음 ${pct(st.same,st.nPairs)}% · 증가 ${pct(st.worse,st.nPairs)}% · 1개 부위 이상 1점 넘게 내려간 참여자 ${pct(st.personsImproved,st.persons)}% (사전 0점은 판정 제외)`:'전후 짝 없음');
  lines.push('');lines.push('| 부위 | 사전 N | 사전 평균 | 사후 N | 사후 평균 | 짝 N | 사전≥1 짝 | 평균 감소 | 1점↑감소 | 2점↑ | 같음 | 증가 | 출처 |');lines.push('|---|---|---|---|---|---|---|---|---|---|---|---|---|');
  PARTS.forEach(p=>{const s=st.parts[p.id];lines.push(`| ${p.name} | ${s.nPre} | ${s.nPre?fmt1(s.meanPre):'—'} | ${s.nPost} | ${s.nPost?fmt1(s.meanPost):'—'} | ${s.nPairs} | ${s.nPos} | ${s.nPairs?fmt1(s.meanDrop):'—'} | ${s.nPos?pct(s.imp1,s.nPos)+'%':'—'} | ${s.nPos?pct(s.imp2,s.nPos)+'%':'—'} | ${s.nPairs?pct(s.same,s.nPairs)+'%':'—'} | ${s.nPairs?pct(s.worse,s.nPairs)+'%':'—'} | ${s.src==='manual'?'수기':'온라인'} |`);});
  lines.push('');lines.push('한계: 교육 직후 익명 자기보고, 대조군 없음(좌우 비교도 비맹검), 의학적 효과를 의미하지 않음. 같은 기기의 무작위 토큰으로 사전·사후를 짝지었으며 미매칭 응답은 평균에만 포함. 감소율 분모는 사전 1점 이상 짝(사전 0점은 바닥효과로 제외). 1점 변화는 오차 범위일 수 있어 2점 이상을 병기.');
  const csv=['ts,session,token,part,phase,score,extra'].concat(rows.map(r=>[r.ts||'',cfg.session,r.token,r.part,r.phase,r.score,JSON.stringify(r.extra||{})].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))).join('\n');
  closeOverlay();const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="panel"><h3>D+1 리포트 · ${esc(cfg.title||cfg.session)} ${cfg.demo?'<span class="pill demo">데모 데이터</span>':''}</h3><textarea id="rep" readonly>${esc(lines.join('\n'))}</textarea><div class="row"><button id="r_copy">리포트 복사</button><button class="ghost" id="r_csv">원자료 CSV 보기</button><button class="ghost" id="r_refresh">새로고침</button><button class="ghost" id="r_close">닫기</button></div><div class="hint">원자료는 Google 스프레드시트 "responses" 시트에 그대로 남아 있습니다. 이 화면의 CSV는 현재 불러온 세션 데이터입니다.</div><textarea id="csv" readonly hidden>${esc(csv)}</textarea></div>`;
  document.body.appendChild(o);
  $('#r_copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(lines.join('\n'));toast('복사됨');}catch(e){$('#rep').select();}});
  $('#r_csv').addEventListener('click',()=>{const c=$('#csv');c.hidden=!c.hidden;});
  $('#r_refresh').addEventListener('click',async()=>{await refresh(true);openReport();});
  $('#r_close').addEventListener('click',closeOverlay);
}

function runPresenter(){
  render();schedulePoll();
  setInterval(()=>{const c=$('#clock');if(c)c.innerHTML=clockHtml();},1000);
  document.addEventListener('keydown',e=>{
    if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
    if(e.key==='Escape'){closeOverlay();return;}
    if($('.overlay'))return;
    const k=e.key;
    if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();go(idx+1);}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(idx-1);}
    else if(k==='Home'){go(0);}else if(k==='End'){go(SLIDES.length-1);}
    else if(k==='s'||k==='S')openSettings();else if(k==='n'||k==='N'){notesOn=!notesOn;render();}
    else if(k==='r'||k==='R')openReport();else if(k==='m'||k==='M')openManual();
    else if(k==='f'||k==='F'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
    else if(k==='t'||k==='T'){startedAt=Date.now();store('jr.start.'+cfg.session,startedAt);toast('타이머 시작');}
    else if(k==='?'){toast('→ 다음 · ← 이전 · S 설정 · N 노트 · R 리포트 · M 수기집계 · F 전체화면 · T 타이머 재시작');}
  });
  if(!cfg.backend&&!cfg.demo)setTimeout(()=>toast('S 키로 백엔드 URL을 설정하거나 데모 모드를 켜세요'),600);
}

const q=qs();
if(q.mode==='join')runJoin(q);else runPresenter();
})();
</script>
