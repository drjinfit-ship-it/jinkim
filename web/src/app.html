<title>몸의 법정</title>
<meta name="description" content="법원·공공기관 50분 실습 강의 — 재판형 진행(진술·증거조사·재검사·판결)과 5부위 사전/사후 익명 측정, 실시간 결과 보드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
  :root{
    --navy:#0B1730; --navy-2:#132446; --navy-3:#1C3260; --ink:#F3F6FB; --ink-2:#C5D0E2; --ink-3:#8FA3BF;
    --amber:#F5B13D; --amber-2:#FFD27A; --green:#3DD68C; --slate:#8FA3BF; --coral:#FF6B6B; --teal:#5FD3C8;
    --paper:#F7F9FC; --paper-2:#FFFFFF; --paper-3:#E6ECF5; --text:#0B1730; --text-2:#3B4B66; --text-3:#6B7A94; --blue:#1D4ED8;
    --radius:18px; --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Pretendard',system-ui,sans-serif; --serif:'Noto Serif KR','Apple Myungjo','Batang',serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);background:var(--navy);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  body.join{background:var(--paper);color:var(--text);overflow:auto}
  h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
  button{font-family:inherit}
  .num{font-variant-numeric:tabular-nums}
  a{color:inherit}

  /* ===== presenter ===== */
  #stage{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}
  .chrome{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;font-size:14px;color:var(--ink-3);gap:16px}
  .chrome b{color:var(--ink-2);font-weight:700}
  .chrome .clock{display:flex;gap:18px;align-items:center}
  .chrome .clock .over{color:var(--coral)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--navy-2);color:var(--ink-2);font-size:12px;font-weight:700;letter-spacing:.04em}
  .pill.demo{background:#5A3A00;color:var(--amber-2)}
  .pill.live{background:#0E3B2C;color:var(--green)}
  .pill.off{background:#4A1F1F;color:#FFB3B3}
  .pill.manual{background:#2B2F5A;color:#C9CDFF}
  .slide{padding:0 72px 24px;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:auto}
  .slide.top{justify-content:flex-start;padding-top:6px}
  .slide.top h2{font-size:clamp(24px,3.1vw,42px)}
  .slide .eyebrow{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:16px}
  .slide h1{font-size:clamp(40px,6vw,84px);font-weight:900}
  .slide h2{font-size:clamp(28px,3.9vw,54px);font-weight:900}
  .slide h2.serif{font-family:var(--serif)}
  .slide .lead{font-size:clamp(19px,2.1vw,29px);color:var(--ink-2);margin-top:20px;max-width:62ch;line-height:1.45}
  .slide .sub{font-size:clamp(16px,1.6vw,22px);color:var(--ink-3);margin-top:14px;line-height:1.5}
  .cols{display:grid;gap:22px;margin-top:28px}
  .cols.c3{grid-template-columns:repeat(3,1fr)}
  .cols.c2{grid-template-columns:repeat(2,1fr)}
  .cols.c4{grid-template-columns:repeat(4,1fr)}
  .cols.c5{grid-template-columns:repeat(5,1fr)}
  .card{background:var(--navy-2);border-radius:var(--radius);padding:22px 26px;min-height:0}
  .card .k{font-size:13px;letter-spacing:.12em;color:var(--amber);font-weight:700;text-transform:uppercase}
  .card .t{font-size:clamp(18px,1.85vw,26px);font-weight:900;margin-top:8px;line-height:1.25}
  .card .d{font-size:clamp(14px,1.4vw,19px);color:var(--ink-2);margin-top:10px;line-height:1.55}
  .card .d ul{margin:0;padding-left:20px}
  .card .d li{margin:4px 0}
  .issues-grid .card{padding:16px 18px}
  .practice .card{padding:18px 22px}
  .practice .card .d{font-size:clamp(13px,1.3vw,17px)}
  .practice h2{font-size:clamp(26px,3.4vw,46px)}
  .card.warm{background:#3A2A0F}
  .card.warm .k{color:var(--amber-2)}
  .card.cool{background:#0F2E3F}
  .card.cool .k{color:var(--teal)}
  .card.ruling{background:#0E3B2C}
  .card.ruling .k{color:var(--green)}
  .quote{font-size:clamp(20px,2.4vw,34px);font-weight:700;line-height:1.4;color:var(--amber-2);margin-top:24px;max-width:44ch;font-family:var(--serif)}
  .safety{margin-top:22px;font-size:clamp(14px,1.35vw,18px);color:#FFC9C9;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
  .safety::before{content:"!";flex:none;width:26px;height:26px;border-radius:50%;background:#7A2C2C;color:#FFD5D5;display:grid;place-items:center;font-weight:900}
  .footer{display:flex;justify-content:space-between;align-items:center;padding:10px 28px 18px;font-size:13px;color:var(--ink-3)}
  .footer .nav{display:flex;gap:8px}
  .footer button,.iconbtn{background:var(--navy-2);color:var(--ink-2);border:0;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .footer button:hover,.iconbtn:hover{background:var(--navy-3)}
  .footer button:focus-visible,.iconbtn:focus-visible,.scale button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--navy-3);padding:1px 6px;border-radius:5px;color:var(--ink-2)}

  /* issue (쟁점) slide */
  .issue{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;margin-top:22px;align-items:start}
  .ev{display:grid;gap:10px}
  .ev .e{background:var(--navy-2);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
  .ev .e .b{font-size:12px;font-weight:900;letter-spacing:.08em;padding:4px 8px;border-radius:6px;background:var(--navy-3);color:var(--ink-2);white-space:nowrap}
  .ev .e .b.lit{background:#2B2F5A;color:#C9CDFF}
  .ev .e .b.site{background:#0F2E3F;color:var(--teal)}
  .ev .e .b.exp{background:#3A2A0F;color:var(--amber-2)}
  .ev .e .x{font-size:clamp(14px,1.35vw,18px);line-height:1.5;color:var(--ink)}
  .ev .e .s{font-size:12.5px;color:var(--ink-3);margin-top:4px}
  .rulingbar{margin-top:20px;background:#0E3B2C;border-radius:16px;padding:18px 22px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
  .rulingbar .k{font-size:13px;letter-spacing:.12em;color:var(--green);font-weight:900}
  .rulingbar .t{font-size:clamp(17px,1.9vw,26px);font-weight:900;line-height:1.35}
  .rulingbar .a{font-size:clamp(13px,1.3vw,17px);color:var(--ink-2);margin-top:6px}
  .qno{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--amber);color:var(--navy);font-weight:900;font-size:22px;margin-right:12px;vertical-align:middle}

  /* part practice */
  .hyp{margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .hyp .tag{font-size:12px;font-weight:900;letter-spacing:.1em;padding:5px 9px;border-radius:6px;background:var(--navy-3);color:var(--amber)}
  .hyp .x{font-size:clamp(16px,1.7vw,23px);color:var(--ink-2)}
  .evchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .evchips span{font-size:clamp(12px,1.15vw,15px);background:var(--navy-2);color:var(--ink-2);padding:6px 10px;border-radius:8px;line-height:1.4}
  .evchips span b{color:var(--teal);font-weight:900;margin-right:6px}

  /* QR slide */
  .qrwrap{display:grid;grid-template-columns:minmax(280px,400px) 1fr;gap:48px;align-items:center;margin-top:22px}
  .qrbox{background:#fff;border-radius:24px;padding:20px;display:grid;place-items:center;aspect-ratio:1/1;width:100%;max-width:400px}
  .qrbox canvas{width:100%;height:auto;image-rendering:pixelated}
  .qrurl{font-size:12.5px;color:var(--ink-3);margin-top:10px;word-break:break-all;max-width:400px}
  .board{display:grid;gap:16px}
  .stat{background:var(--navy-2);border-radius:var(--radius);padding:20px 24px}
  .stat .l{font-size:14px;color:var(--ink-3);font-weight:700;letter-spacing:.06em}
  .stat .v{font-size:clamp(40px,5.4vw,78px);font-weight:900;line-height:1.05;margin-top:6px}
  .stat .v small{font-size:.38em;color:var(--ink-3);font-weight:700;margin-left:8px}
  .stat .v.good{color:var(--green)}
  .stat .v.amber{color:var(--amber)}
  .stat .v.bad{color:var(--coral)}
  .stat .m{font-size:15px;color:var(--ink-2);margin-top:8px;line-height:1.5}
  .stat.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px}
  .stat.row .arrow{font-size:40px;color:var(--ink-3)}
  .dist{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;align-items:end;height:100px;margin-top:8px}
  .dist .bar{background:var(--navy-3);border-radius:6px 6px 2px 2px;position:relative;min-height:3px}
  .dist .bar.hot{background:var(--amber)}
  .dist .bar span{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:12px;color:var(--ink-2);padding-bottom:3px}
  .dist .bar i{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:12px;color:var(--ink-3);font-style:normal;padding-top:4px}
  .waiting{font-size:clamp(18px,2vw,26px);color:var(--ink-3)}
  .statement{margin-top:14px;font-size:clamp(15px,1.5vw,20px);color:var(--ink-2);line-height:1.5;max-width:60ch}

  /* verdict (finale) */
  .finale-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;margin-top:20px;align-items:start}
  .big{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .big .stat{padding:14px 20px}
  .big .stat .v{font-size:clamp(36px,4.4vw,64px)}
  table.parts{width:100%;border-collapse:collapse;font-size:clamp(13px,1.35vw,18px);margin-top:4px}
  table.parts th,table.parts td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--navy-3)}
  table.parts th{color:var(--ink-3);font-weight:700;font-size:.85em;letter-spacing:.06em}
  table.parts td:first-child,table.parts th:first-child{text-align:left;font-weight:700}
  table.parts .good{color:var(--green);font-weight:900}
  .barrow{display:grid;grid-template-columns:130px 1fr 64px;gap:12px;align-items:center;margin-top:6px;font-size:clamp(13px,1.3vw,17px)}
  .barrow .track{height:20px;background:var(--navy-3);border-radius:8px;overflow:hidden}
  .barrow .fill{height:100%;background:var(--green);width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
  .barrow .fill.same{background:var(--slate)}
  .verdictdoc{margin-top:14px;background:var(--navy-2);border-radius:16px;padding:16px 20px;font-size:clamp(13px,1.3vw,17px);line-height:1.6;color:var(--ink-2);font-family:var(--serif)}
  .verdictdoc b{color:var(--ink)}
  .disclaimer{margin-top:16px;font-size:13.5px;color:var(--ink-3);line-height:1.5;max-width:90ch}
  .reveal{display:grid;place-items:center;min-height:38vh}
  .reveal button{font-size:clamp(22px,2.6vw,36px);font-weight:900;padding:22px 54px;border-radius:999px;border:0;background:var(--amber);color:var(--navy);cursor:pointer;box-shadow:0 20px 60px rgba(245,177,61,.25);font-family:var(--serif)}
  .reveal button:hover{background:var(--amber-2)}
  .refs{font-size:clamp(13px,1.3vw,17px);color:var(--ink-2);line-height:1.6;margin-top:18px;columns:2;column-gap:40px}
  .refs div{break-inside:avoid;margin-bottom:8px}
  .refs .c{font-size:11px;color:var(--ink-3);margin-left:6px}

  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(5,10,24,.78);display:grid;place-items:center;z-index:50;padding:24px}
  .panel{background:var(--navy-2);border-radius:22px;padding:28px 30px;width:min(880px,96vw);max-height:92vh;overflow:auto;color:var(--ink)}
  .panel h3{font-size:22px;font-weight:900;margin-bottom:16px}
  .panel label{display:block;font-size:13px;color:var(--ink-3);font-weight:700;margin:14px 0 6px;letter-spacing:.04em}
  .panel input[type=text],.panel input[type=url],.panel input[type=number],.panel textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--navy-3);background:var(--navy);color:var(--ink);font-size:15px;font-family:inherit}
  .panel textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .panel .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
  .panel .row button{background:var(--amber);color:var(--navy);border:0;border-radius:10px;padding:10px 16px;font-weight:900;cursor:pointer}
  .panel .row button.ghost{background:var(--navy-3);color:var(--ink-2)}
  .panel .hint{font-size:13px;color:var(--ink-3);line-height:1.55;margin-top:8px}
  .panel .ok{color:var(--green);font-weight:700}
  .panel .err{color:var(--coral);font-weight:700}
  .notes{position:fixed;right:24px;bottom:70px;width:min(520px,44vw);background:rgba(19,36,70,.96);border-radius:16px;padding:18px 20px;font-size:15px;line-height:1.6;color:var(--ink-2);z-index:40;box-shadow:0 20px 60px rgba(0,0,0,.4);max-height:60vh;overflow:auto}
  .notes h4{margin:0 0 8px;font-size:13px;letter-spacing:.1em;color:var(--amber)}
  .toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--amber);color:var(--navy);padding:10px 18px;border-radius:999px;font-weight:900;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .manual-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .manual-grid label{margin:0 0 6px}

  /* ===== participant (join) ===== */
  .join-wrap{max-width:520px;margin:0 auto;padding:22px 18px 60px}
  .join-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-3);font-weight:700;letter-spacing:.04em}
  .join-card{background:var(--paper-2);border-radius:22px;padding:24px 20px;margin-top:16px;box-shadow:0 10px 40px rgba(11,23,48,.08)}
  .join-card .phase{display:inline-block;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:900;letter-spacing:.06em}
  .join-card .phase.pre{background:#E8EFFF;color:var(--blue)}
  .join-card .phase.post{background:#E6F8EF;color:#0B7A47}
  .join-card h1{font-size:30px;font-weight:900;margin-top:12px}
  .join-card .q{font-size:17px;color:var(--text-2);margin-top:10px;line-height:1.5}
  .scale{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;margin-top:20px}
  .scale button{aspect-ratio:1/1.35;min-width:0;border-radius:9px;border:2px solid var(--paper-3);background:#fff;font-size:15px;font-weight:900;color:var(--text);cursor:pointer;padding:0;letter-spacing:-.04em}
  .scale button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .scale .ends{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chips button{border:2px solid var(--paper-3);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:700;color:var(--text-2);cursor:pointer}
  .chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .submit{width:100%;margin-top:22px;padding:18px;border-radius:14px;border:0;background:var(--navy);color:#fff;font-size:19px;font-weight:900;cursor:pointer}
  .submit[disabled]{background:#B9C3D6;cursor:not-allowed}
  .fine{font-size:12.5px;color:var(--text-3);margin-top:14px;line-height:1.55}
  .done{text-align:center;padding:14px 0 4px}
  .done .check{width:72px;height:72px;border-radius:50%;background:#E6F8EF;color:#0B7A47;display:grid;place-items:center;font-size:36px;font-weight:900;margin:0 auto 12px}
  .done h2{font-size:26px;font-weight:900}
  .done .mine{margin-top:16px;background:var(--paper);border-radius:14px;padding:14px;font-size:16px;color:var(--text-2)}
  .done .mine b{font-size:22px;color:var(--text)}
  .done .card-verdict{margin-top:14px;text-align:left;background:#FFF8E8;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;color:#4A3A10;font-family:var(--serif)}
  .group{margin-top:16px;border-top:1px dashed var(--paper-3);padding-top:14px}
  .group .l{font-size:13px;color:var(--text-3);font-weight:700;letter-spacing:.06em}
  .group .v{font-size:34px;font-weight:900;color:var(--navy);margin-top:4px}
  .group .v.good{color:#0B7A47}
  .group .m{font-size:13px;color:var(--text-3);margin-top:4px}
  .join-error{background:#FFF0F0;color:#8A1F1F;border-radius:14px;padding:16px;font-weight:700;line-height:1.5}

  @media (max-width:900px){
    .slide{padding:0 28px 16px}
    .cols.c3,.cols.c5,.cols.c2,.cols.c4{grid-template-columns:1fr}
    .qrwrap,.issue,.finale-grid{grid-template-columns:1fr}
    .refs{columns:1}
  }
  @media (prefers-reduced-motion:reduce){ .barrow .fill{transition:none} }
</style>

<div id="app"></div>

<script>/*__QR_BUNDLE__*/</script>
<script>window.SPEC=/*__SPEC__*/{};</script>
<script>
/* ============================================================
   몸의 법정 — 재판형 강의 발표 화면 + 참가자 화면 (단일 파일)
   모드: 기본 = 발표자 / ?mode=join&s=세션&p=부위&t=pre|post = 참가자
   콘텐츠는 SPEC(JSON)에서 읽고, 측정 엔진은 그대로 유지한다.
   ============================================================ */
(function(){
'use strict';

const SPEC=window.SPEC||{};
const FALLBACK_PARTS=[
  {id:'foot',name:'발·발목',hypothesis:'발이 1층입니다. 1층의 감각이 둔해지면 위층이 대신 버팁니다.',statement:'지금 발·발목의 불편감을 0~10으로 진술해 주세요.',check:'제자리에서 가볍게 3번 뛰거나 3걸음 걷기. 발바닥 느낌과 무게를 기억합니다.',reset:['의자에 앉아 한쪽 발만: 뒤꿈치는 바닥, 발 아치 중앙에 공','굴리지 않고 누른 채 5초 내쉬기 ×5','누른 채 엄지↑네 발가락↓ 교대 ×10'],compare:'안 푼 발 vs 푼 발로 제자리 가볍게 뛰기. 어느 발이 가볍고 탄력이 있습니까?',slogan:'발은 1층입니다. 1층이 무너지면 위층이 다 무너집니다.',keep:'걸을 때 뒤꿈치 바깥 → 앞꿈치. 95%는 딴생각, 5%만 발바닥에.',safety:'최근 발목을 삐었거나 발바닥이 붓고 뜨거우면 압박은 생략하고 걷기만 합니다.',ruling:'소결: 발·발목 평균 {drop}점 감소, {pct}% 개선.',evidence:[],notes:''},

function randId(n){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';const c=new Uint8Array(n);(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(c):c.forEach((_,i)=>c[i]=Math.floor(Math.random()*256));for(let i=0;i<n;i++)s+=a[c[i]%a.length];return s;}

function drawQR(canvas,text){
  const q=window.QRCodeGen(text,'M'),n=q.getModuleCount(),cell=8,quiet=4,size=(n+quiet*2)*cell;
  canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);ctx.fillStyle='#0B1730';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect((c+quiet)*cell,(r+quiet)*cell,cell,cell);
}

/* ---------- demo data (가상, 화면에 항상 표시) ---------- */
const demo=(function(){
  let seed=20260903;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  const rows=[];const N=38;
  const base={foot:4.2,neck:5.6,shoulder:5.9,back:5.1,knee:3.8};
  for(let i=0;i<N;i++){const token='demo'+i;PARTS.forEach(p=>{
    const pre=Math.max(0,Math.min(10,Math.round(base[p.id]+(rnd()-0.5)*5)));
    rows.push({token,part:p.id,phase:'pre',score:pre,extra:{}});
    if(rnd()<0.86){const drop=pre===0?0:Math.max(-1,Math.min(pre,Math.round(rnd()*4-0.9)));rows.push({token,part:p.id,phase:'post',score:Math.max(0,Math.min(10,pre-drop)),extra:{}});}
  });}
  return {rows:()=>rows.slice(),add:d=>rows.push(Object.assign({},d))};
})();

/* ---------- stats ---------- */
function computeStats(rows,manual){
  const latest={};rows.forEach(r=>{if(!PART_BY[r.part]||(r.phase!=='pre'&&r.phase!=='post'))return;const s=Number(r.score);if(!(s>=0&&s<=10))return;latest[r.token+'|'+r.part+'|'+r.phase]=s;});
  const tokens=new Set();Object.keys(latest).forEach(k=>tokens.add(k.split('|')[0]));
  const parts={};let allPairs=[],allPos=0;const personPairs={};
  PARTS.forEach(p=>{
    const pre=[],post=[],pairs=[];let posPairs=0;const dist=Array(11).fill(0);
    tokens.forEach(t=>{const a=latest[t+'|'+p.id+'|pre'],b=latest[t+'|'+p.id+'|post'];
      if(a!==undefined){pre.push(a);dist[a]++;}if(b!==undefined)post.push(b);
      if(a!==undefined&&b!==undefined){pairs.push(a-b);if(a>=1)posPairs++;(personPairs[t]=personPairs[t]||[]).push(a-b);}});
    let src='live';
    if(pairs.length===0&&manual&&manual[p.id]){const m=manual[p.id];src='manual';
      for(let i=0;i<(m.same||0);i++)pairs.push(0);for(let i=0;i<(m.d1||0);i++)pairs.push(1);for(let i=0;i<(m.d2||0);i++)pairs.push(2);for(let i=0;i<(m.d3||0);i++)pairs.push(3);for(let i=0;i<(m.worse||0);i++)pairs.push(-1);posPairs=pairs.length;}
    const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
    parts[p.id]={nPre:pre.length,nPost:post.length,meanPre:mean(pre),meanPost:mean(post),dist,nPairs:pairs.length,nPos:posPairs,meanDrop:mean(pairs),imp1:pairs.filter(d=>d>=1).length,imp2:pairs.filter(d=>d>=2).length,same:pairs.filter(d=>d===0).length,worse:pairs.filter(d=>d<0).length,src};
    allPairs=allPairs.concat(pairs);allPos+=posPairs;
  });
  const persons=Object.keys(personPairs);const personsImproved=persons.filter(t=>personPairs[t].some(d=>d>=1)).length;
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return {parts,participants:tokens.size,nPairs:allPairs.length,nPos:allPos,meanDrop:mean(allPairs),imp1:allPairs.filter(d=>d>=1).length,imp2:allPairs.filter(d=>d>=2).length,same:allPairs.filter(d=>d===0).length,worse:allPairs.filter(d=>d<0).length,persons:persons.length,personsImproved,dropDist:{0:allPairs.filter(d=>d<=0).length,1:allPairs.filter(d=>d===1).length,2:allPairs.filter(d=>d===2).length,3:allPairs.filter(d=>d>=3).length}};
}

   PRESENTER — 슬라이드 시퀀스: SPEC.slides(앞부분) → 부위 5개 × (진술 QR · 증거조사 · 재검사 QR) → SPEC.slides(뒷부분) → 참고문헌

function buildSlides(){
  const common=(SPEC.slides&&SPEC.slides.length)?SPEC.slides.slice():[{id:'open',type:'open',min:1,title:'오늘 재판장은 여러분입니다'}];
  let cut=common.findIndex(s=>['verdict','close'].includes(s.type)||s.after_parts===true);
  if(cut<0)cut=common.length;
  const pre=common.slice(0,cut),post=common.slice(cut);
  const seq=[];
  pre.forEach(s=>seq.push(Object.assign({min:1},s)));
  PARTS.forEach(p=>{seq.push({id:'qr-'+p.id+'-pre',type:'qr',part:p.id,phase:'pre',min:1.5});seq.push({id:'practice-'+p.id,type:'practice',part:p.id,min:5});seq.push({id:'qr-'+p.id+'-post',type:'qr',part:p.id,phase:'post',min:1.5});});
  post.forEach(s=>seq.push(Object.assign({min:1},s)));
  if(!seq.some(s=>s.type==='verdict'))seq.push({id:'verdict',type:'verdict',min:2,title:'판결'});
  if(SPEC.references&&SPEC.references.length)seq.push({id:'references',type:'references',min:0,title:'참고 근거'});
  let acc=0;seq.forEach(x=>{acc+=Number(x.min)||0;x.cum=acc;});
  return seq;
}

  const fn=R[sl.type]||R.generic;const body=fn(sl);
  const notes=sl.type==='practice'?PART_BY[sl.part].notes:(sl.type==='qr'?(sl.phase==='pre'?'[1.5분] "휴대폰을 들고 찍고, 숫자 하나 누르고, 내려놓기." 응답 수가 올라가는 것을 보여주며 기다린다. '+(PART_BY[sl.part].statement||''):'[1.5분] 같은 기준으로 재검사. 평균 감소 폭과 개선율을 증거처럼 읽어 준다. 변화 없는 분도 데이터라고 말한다.'):(sl.notes||''));
  app.innerHTML=`<div id="stage"><div class="chrome"><div><b>${esc(cfg.program)}</b> &nbsp;·&nbsp; ${esc(cfg.title||cfg.session)} &nbsp; ${chromeStatus()}</div><div class="clock" id="clock">${clockHtml()}</div></div><div class="slide ${(sl.type==='verdict'&&revealed)||['issue','references','issues','practice','rules','close'].includes(sl.type)?'top':''} ${sl.type==='practice'?'practice':''}">${body}</div><div class="footer"><div>${esc(cfg.brand)} · <span class="kbd">→</span> 다음 <span class="kbd">←</span> 이전 <span class="kbd">S</span> 설정 <span class="kbd">N</span> 노트 <span class="kbd">R</span> 리포트 <span class="kbd">M</span> 수기집계 <span class="kbd">F</span> 전체화면 <span class="kbd">T</span> 타이머</div><div class="nav"><button id="refreshBtn">새로고침</button><button id="prevBtn">◀ 이전</button><button id="nextBtn">다음 ▶</button></div></div></div>${notesOn?`<div class="notes"><h4>강사 노트</h4>${esc(notes||'(노트 없음)')}</div>`:''}`;
  if(sl.type==='qr'){try{drawQR($('#qr'),joinUrl(sl.part,sl.phase));}catch(e){}}
  autoFit();
  if(sl.type==='verdict'){const b=$('#revealBtn');if(b)b.addEventListener('click',()=>{revealed=true;render();});if(revealed)animateFinale();}
  $('#prevBtn').addEventListener('click',()=>go(idx-1));$('#nextBtn').addEventListener('click',()=>go(idx+1));$('#refreshBtn').addEventListener('click',()=>refresh(true));
  store('jr.idx.'+cfg.session,idx);
}
function autoFit(){const el=$('.slide');if(!el)return;el.style.zoom='';let z=1;for(let i=0;i<4;i++){const ratio=el.clientHeight/el.scrollHeight;if(ratio>=0.995)break;z=Math.max(0.5,z*ratio*0.97);el.style.zoom=z.toFixed(3);}}
window.addEventListener('resize',()=>autoFit());
function animateFinale(){
  document.querySelectorAll('[data-count]').forEach(el=>{const target=Number(el.dataset.count),dec=Number(el.dataset.dec||0),small=el.querySelector('small')?el.querySelector('small').outerHTML:'';const t0=performance.now(),dur=1400;
    (function step(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.innerHTML=(target*e).toFixed(dec)+small;if(k<1)requestAnimationFrame(step);})(t0);});
  requestAnimationFrame(()=>document.querySelectorAll('.fill[data-w]').forEach(el=>el.style.width=el.dataset.w+'%'));
}
function go(n){if(n<0||n>=SLIDES.length)return;idx=n;if(!startedAt&&idx>0){startedAt=Date.now();store('jr.start.'+cfg.session,startedAt);}render();schedulePoll();}
async function refresh(force){
  const sl=SLIDES[idx];if(!force&&sl.type!=='qr'&&sl.type!=='verdict')return;
  try{rows=await api.rows(cfg.session);fetchErr=null;lastFetch=new Date().toLocaleTimeString('ko-KR',{hour12:false});}
  catch(e){fetchErr=e.message;}
  stats=computeStats(rows,manual());
  if(sl.type==='qr'||(sl.type==='verdict'&&revealed===false)||force)render();
}
function schedulePoll(){clearInterval(pollTimer);const sl=SLIDES[idx];if(sl.type==='qr'||sl.type==='verdict'){refresh();pollTimer=setInterval(refresh,5000);}}
function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2200);}

/* overlays */
function closeOverlay(){const o=$('.overlay');if(o)o.remove();}
function openSettings(){
  closeOverlay();const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="panel"><h3>설정</h3>
  <label>세션 코드 (영문·숫자·하이픈, QR에 포함됨)</label><input type="text" id="f_session" value="${esc(cfg.session)}">
  <label>세션 표시명</label><input type="text" id="f_title" value="${esc(cfg.title)}">
  <label>백엔드 URL (Google Apps Script 웹 앱 /exec)</label><input type="url" id="f_backend" value="${esc(cfg.backend)}" placeholder="https://script.google.com/macros/s/.../exec">
  <label>참가자 페이지 주소 (비우면 현재 주소 사용: ${esc(location.origin+location.pathname)})</label><input type="url" id="f_join" value="${esc(cfg.joinBase)}" placeholder="https://drjinfit-ship-it.github.io/jinkim/web/">
  <label>복습 자료 URL (선택)</label><input type="url" id="f_review" value="${esc(cfg.reviewUrl)}">
  <label>퍼센트 표시 최소 N</label><input type="number" id="f_minN" value="${esc(cfg.minN)}" min="1" max="100">
  <label>브랜드 / 프로그램명 / 연락처</label><input type="text" id="f_brand" value="${esc(cfg.brand)}"><input type="text" id="f_program" value="${esc(cfg.program)}" style="margin-top:6px"><input type="text" id="f_contact" value="${esc(cfg.contact)}" style="margin-top:6px">
  <div class="row"><label style="margin:0;display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="f_demo" ${cfg.demo?'checked':''}> 데모 모드 (가상 데이터로 리허설)</label><label style="margin:0;display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="f_showContact" ${cfg.showContact?'checked':''}> 마지막 화면에 연락처 표시</label></div>
  <div class="hint">${location.protocol==='file:'?'<span class="err">지금은 파일로 열려 있어 QR이 참가자 휴대폰에서 열리지 않습니다. GitHub Pages 주소로 배포한 뒤 그 주소로 여세요.</span><br>':''}실제 수집을 하려면 README의 배포 절차대로 Apps Script를 배포하고 위 백엔드 URL을 넣은 뒤 "연결 테스트"를 누르세요. 데모 모드가 켜져 있으면 서버에 아무것도 보내지 않습니다.</div>
  <div class="row"><button id="f_save">저장</button><button class="ghost" id="f_test">연결 테스트</button><button class="ghost" id="f_reset">진행 초기화 (타이머·슬라이드)</button><button class="ghost" id="f_close">닫기</button><span id="f_msg"></span></div></div>`;
  document.body.appendChild(o);
  const read=()=>{cfg.session=$('#f_session').value.trim().replace(/[^A-Za-z0-9_\-.]/g,'-').slice(0,64)||'session';cfg.title=$('#f_title').value.trim();cfg.backend=$('#f_backend').value.trim();cfg.joinBase=$('#f_join').value.trim();cfg.reviewUrl=$('#f_review').value.trim();cfg.minN=Math.max(1,Number($('#f_minN').value)||5);cfg.brand=$('#f_brand').value.trim()||DEFAULTS.brand;cfg.program=$('#f_program').value.trim()||DEFAULTS.program;cfg.contact=$('#f_contact').value.trim();cfg.demo=$('#f_demo').checked;cfg.showContact=$('#f_showContact').checked;saveCfg();};
  $('#f_save').addEventListener('click',()=>{read();closeOverlay();revealed=false;startedAt=store('jr.start.'+cfg.session)||null;idx=Number(store('jr.idx.'+cfg.session))||0;render();schedulePoll();toast('저장됨');});
  $('#f_test').addEventListener('click',async()=>{read();const m=$('#f_msg');m.textContent='확인 중…';m.className='';try{const j=await api.ping();m.textContent=j.demo?'데모 모드 — 서버 사용 안 함':'연결 성공';m.className='ok';}catch(e){m.textContent='연결 실패: 배포 URL과 "모든 사용자" 액세스 설정을 확인하세요';m.className='err';}});
  $('#f_reset').addEventListener('click',()=>{if(!confirm('타이머와 슬라이드 위치를 처음으로 되돌립니다. 수집 데이터는 지워지지 않습니다.'))return;store('jr.start.'+cfg.session,null);startedAt=null;idx=0;revealed=false;closeOverlay();render();});
  $('#f_close').addEventListener('click',closeOverlay);
}
function openManual(){
  const sl=SLIDES[idx];const pid=sl.part||PARTS[0].id;const m=manual();const cur=m[pid]||{};
  closeOverlay();const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="panel"><h3>수기 집계 (오프라인 대안) · ${esc(PART_BY[pid].name)}</h3><div class="hint">QR이 안 될 때 손들기로 셉니다. "실습 후 몇 점 좋아졌습니까?" — 각 인원수를 입력하면 이 부위의 전후 짝 데이터로 사용됩니다(온라인 짝이 하나라도 있으면 온라인 데이터가 우선).</div>
  <div class="manual-grid" style="margin-top:14px"><div><label>변화 없음</label><input type="number" id="m_same" min="0" value="${cur.same||0}"></div><div><label>1점 감소</label><input type="number" id="m_d1" min="0" value="${cur.d1||0}"></div><div><label>2점 감소</label><input type="number" id="m_d2" min="0" value="${cur.d2||0}"></div><div><label>3점 이상 감소</label><input type="number" id="m_d3" min="0" value="${cur.d3||0}"></div><div><label>증가</label><input type="number" id="m_worse" min="0" value="${cur.worse||0}"></div></div>
  <div class="row"><button id="m_save">저장</button><button class="ghost" id="m_clear">이 부위 삭제</button><button class="ghost" id="m_close">닫기</button></div></div>`;
  document.body.appendChild(o);
  $('#m_save').addEventListener('click',()=>{m[pid]={same:+$('#m_same').value||0,d1:+$('#m_d1').value||0,d2:+$('#m_d2').value||0,d3:+$('#m_d3').value||0,worse:+$('#m_worse').value||0};store('jr.manual.'+cfg.session,m);closeOverlay();stats=computeStats(rows,manual());render();toast('수기 집계 저장');});
  $('#m_clear').addEventListener('click',()=>{delete m[pid];store('jr.manual.'+cfg.session,m);closeOverlay();stats=computeStats(rows,manual());render();});
  $('#m_close').addEventListener('click',closeOverlay);
}
function openReport(){
  const st=stats;const lines=[];
  lines.push(`# ${cfg.title||cfg.session} — 현장 익명 사전/사후 자기평가 집계 (${new Date().toLocaleString('ko-KR')})`);
  lines.push(`참여자(익명 기기) ${st.participants}명 · 전후 짝 있는 참여자 ${st.persons}명 · 전후 응답 쌍 ${st.nPairs}건`);
  lines.push(st.nPairs?`전체: 평균 ${fmt1(st.meanDrop)}점 감소(전후 짝 ${st.nPairs}건) · 사전 1점 이상 ${st.nPos}건 중 1점 이상 감소 ${pct(st.imp1,st.nPos)}% · 2점 이상 ${pct(st.imp2,st.nPos)}% · 전체 짝 중 변화 없음 ${pct(st.same,st.nPairs)}% · 증가 ${pct(st.worse,st.nPairs)}% · 1개 부위 이상 1점 넘게 내려간 참여자 ${pct(st.personsImproved,st.persons)}% (사전 0점은 판정 제외)`:'전후 짝 없음');
  lines.push('');lines.push('| 부위 | 사전 N | 사전 평균 | 사후 N | 사후 평균 | 짝 N | 사전≥1 짝 | 평균 감소 | 1점↑감소 | 2점↑ | 같음 | 증가 | 출처 |');lines.push('|---|---|---|---|---|---|---|---|---|---|---|---|---|');
  PARTS.forEach(p=>{const s=st.parts[p.id];lines.push(`| ${p.name} | ${s.nPre} | ${s.nPre?fmt1(s.meanPre):'—'} | ${s.nPost} | ${s.nPost?fmt1(s.meanPost):'—'} | ${s.nPairs} | ${s.nPos} | ${s.nPairs?fmt1(s.meanDrop):'—'} | ${s.nPos?pct(s.imp1,s.nPos)+'%':'—'} | ${s.nPos?pct(s.imp2,s.nPos)+'%':'—'} | ${s.nPairs?pct(s.same,s.nPairs)+'%':'—'} | ${s.nPairs?pct(s.worse,s.nPairs)+'%':'—'} | ${s.src==='manual'?'수기':'온라인'} |`);});
  lines.push('');lines.push('한계: 교육 직후 익명 자기보고, 대조군 없음(좌우 비교도 비맹검), 의학적 효과를 의미하지 않음. 같은 기기의 무작위 토큰으로 사전·사후를 짝지었으며 미매칭 응답은 평균에만 포함. 감소율 분모는 사전 1점 이상 짝(사전 0점은 바닥효과로 제외). 1점 변화는 오차 범위일 수 있어 2점 이상을 병기.');
  const csv=['ts,session,token,part,phase,score,extra'].concat(rows.map(r=>[r.ts||'',cfg.session,r.token,r.part,r.phase,r.score,JSON.stringify(r.extra||{})].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))).join('\n');
  closeOverlay();const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="panel"><h3>D+1 리포트 · ${esc(cfg.title||cfg.session)} ${cfg.demo?'<span class="pill demo">데모 데이터</span>':''}</h3><textarea id="rep" readonly>${esc(lines.join('\n'))}</textarea><div class="row"><button id="r_copy">리포트 복사</button><button class="ghost" id="r_csv">원자료 CSV 보기</button><button class="ghost" id="r_refresh">새로고침</button><button class="ghost" id="r_close">닫기</button></div><div class="hint">원자료는 Google 스프레드시트 "responses" 시트에 그대로 남아 있습니다. 이 화면의 CSV는 현재 불러온 세션 데이터입니다.</div><textarea id="csv" readonly hidden>${esc(csv)}</textarea></div>`;
  document.body.appendChild(o);
  $('#r_copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(lines.join('\n'));toast('복사됨');}catch(e){$('#rep').select();}});
  $('#r_csv').addEventListener('click',()=>{const c=$('#csv');c.hidden=!c.hidden;});
  $('#r_refresh').addEventListener('click',async()=>{await refresh(true);openReport();});
  $('#r_close').addEventListener('click',closeOverlay);
}

function runPresenter(){
  render();schedulePoll();
  setInterval(()=>{const c=$('#clock');if(c)c.innerHTML=clockHtml();},1000);
  document.addEventListener('keydown',e=>{
    if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
    if(e.key==='Escape'){closeOverlay();return;}
    if($('.overlay'))return;
    const k=e.key;
    if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();go(idx+1);}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(idx-1);}
    else if(k==='Home'){go(0);}else if(k==='End'){go(SLIDES.length-1);}
    else if(k==='s'||k==='S')openSettings();else if(k==='n'||k==='N'){notesOn=!notesOn;render();}
    else if(k==='r'||k==='R')openReport();else if(k==='m'||k==='M')openManual();
    else if(k==='f'||k==='F'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
    else if(k==='t'||k==='T'){startedAt=Date.now();store('jr.start.'+cfg.session,startedAt);toast('타이머 시작');}
    else if(k==='?'){toast('→ 다음 · ← 이전 · S 설정 · N 노트 · R 리포트 · M 수기집계 · F 전체화면 · T 타이머 재시작');}
  });
  if(!cfg.backend&&!cfg.demo)setTimeout(()=>toast('S 키로 백엔드 URL을 설정하거나 데모 모드를 켜세요'),600);
}

const q=qs();
if(q.mode==='join')runJoin(q);else runPresenter();
})();
</script>
